<style>
/* layout: one working column up to 1180px; the tagging screen splits into pitch | form and stacks on a phone */
:root {
  color-scheme: light;
  --bg: #f3f5f1;
  --surface: #fdfdfb;
  --sunken: #eceee9;
  --ink: #111714;
  --ink-2: #4a514c;
  --muted: #6d746e;
  --line: #dde1da;
  --line-2: #bfc6be;
  --accent: #0f6a45;
  --on-accent: #ffffff;
  --accent-soft: #e2f0e8;
  --home: #2a78d6;
  --away: #eb6834;
  --ok-text: #006300;
  --danger-text: #b42318;
  --danger-soft: #fdecea;
  --warn-soft: #fff4d6;
  --shadow: 0 1px 2px rgba(17, 23, 20, 0.06), 0 6px 20px rgba(17, 23, 20, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1210; --surface: #181d1a; --sunken: #121614; --ink: #f2f5f1; --ink-2: #c2c8c1; --muted: #949b94;
    --line: #2a312c; --line-2: #414a43; --accent: #43b987; --on-accent: #06140d; --accent-soft: #17302a;
    --home: #3987e5; --away: #d95926; --ok-text: #4cc46f; --danger-text: #ff9a8f; --danger-soft: #3a1c19; --warn-soft: #3a3115;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1210; --surface: #181d1a; --sunken: #121614; --ink: #f2f5f1; --ink-2: #c2c8c1; --muted: #949b94;
  --line: #2a312c; --line-2: #414a43; --accent: #43b987; --on-accent: #06140d; --accent-soft: #17302a;
  --home: #3987e5; --away: #d95926; --ok-text: #4cc46f; --danger-text: #ff9a8f; --danger-soft: #3a1c19; --warn-soft: #3a3115;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

/* the public page's club colours: a match (or a player's or keeper's card) sets --ch-l, --ch-d, --ca-l and --ca-d for
   its two sides in both modes, and the home and away colours inside it follow. Without them the standard blue and orange stay. */
.club-colors { --home: var(--ch-l, #2a78d6); --away: var(--ca-l, #eb6834); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .club-colors { --home: var(--ch-d, #3987e5); --away: var(--ca-d, #d95926); }
}
:root[data-theme="dark"] .club-colors { --home: var(--ch-d, #3987e5); --away: var(--ca-d, #d95926); }

* { box-sizing: border-box; }
/* the public page stands alone, without the frame Claude wraps around the tracker, so the basics are set here too */
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- masthead ---------- */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.brand .season { font-family: var(--font-display); font-weight: 500; font-size: 18px; color: var(--muted); letter-spacing: 0.04em; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.sync svg { width: 14px; height: 14px; flex: none; }
.sync.ok { color: var(--ok-text); }
.sync.bad { color: var(--danger-text); }

.tabs { display: flex; gap: 2px 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); }
.tab { appearance: none; background: none; border: 0; padding: 8px 0 9px; margin-bottom: -1px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- notices ---------- */
.note { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--sunken); color: var(--ink-2); font-size: 13.5px; }
.note > span { flex: 1 1 240px; min-width: 0; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.note.bad { background: var(--danger-soft); color: var(--ink); }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 10px; }
.empty strong { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

/* ---------- controls ---------- */
.btn { appearance: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 6px 12px; font-weight: 500; line-height: 1.3; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); padding-inline: 6px; }
.btn.quiet:hover { color: var(--ink); text-decoration: underline; }
.btn.danger { color: var(--danger-text); }
.btn.big { padding: 10px 20px; font-size: 15px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field { min-width: 0; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-height: 34px; }
textarea.input { min-height: 110px; resize: vertical; }
.input::placeholder { color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-btn { appearance: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 6px 11px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.seg-btn:hover { border-color: var(--ink-2); }
.seg-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.home { background: var(--home); }
.dot.away { background: var(--away); }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.dot.solid { background: var(--muted); }
.dot.soft { background: color-mix(in srgb, var(--home) 24%, transparent); box-shadow: inset 0 0 0 1.5px var(--home); }
.dot.soft.away { background: color-mix(in srgb, var(--away) 24%, transparent); box-shadow: inset 0 0 0 1.5px var(--away); }
/* a club's crest (the public page only): a square box sized where it is used, the crest inside it at its own shape.
   On the dark page, crests whose outer edge is dark get a thin light outline so they do not sink into the background. */
.crest { flex: none; display: block; object-fit: contain; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .crest.edge { filter: drop-shadow(0.7px 0 0 #d8ddd6) drop-shadow(-0.7px 0 0 #d8ddd6) drop-shadow(0 0.7px 0 #d8ddd6) drop-shadow(0 -0.7px 0 #d8ddd6); }
}
:root[data-theme="dark"] .crest.edge { filter: drop-shadow(0.7px 0 0 #d8ddd6) drop-shadow(-0.7px 0 0 #d8ddd6) drop-shadow(0 0.7px 0 #d8ddd6) drop-shadow(0 -0.7px 0 #d8ddd6); }
.club-cell { display: flex; align-items: center; gap: 8px; }
.card-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.row > .grow { flex: 1 1 180px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; justify-content: space-between; }

/* player picker */
.pick { position: relative; }
.pick .input { padding-right: 30px; }
.pick-clear { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 5px; font-size: 16px; line-height: 1; }
.pick-clear:hover { color: var(--ink); background: var(--sunken); }
.pick-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); max-height: 260px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); }
.pick-opt { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.pick-opt .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
.pick-opt.hi { background: var(--accent-soft); }
.pick-opt.add { color: var(--ink); font-weight: 500; border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; margin-top: 2px; }
.pick-none { padding: 8px; color: var(--muted); }

/* ---------- cards & headings ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack.tight { gap: 8px; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }
.deflist { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 6px 16px; margin: 0; max-width: 78ch; }
.deflist dt { font-weight: 600; }
.deflist dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .deflist { grid-template-columns: minmax(0, 1fr); gap: 2px; } .deflist dd { margin-bottom: 8px; } }

/* ---------- fixtures ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); }
.summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.day { display: flex; flex-direction: column; }
.day-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px; display: flex; align-items: center; gap: 10px; }
.day-h .today { background: var(--accent); color: var(--on-accent); border-radius: 4px; padding: 1px 7px; font-size: 13px; }
.fx { display: grid; grid-template-columns: 74px minmax(0, 1fr) 64px minmax(0, 1fr) minmax(110px, auto) 70px; align-items: center; gap: 8px 12px; padding: 9px 12px; border-top: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; }
.day .fx:first-of-type { border-top-left-radius: 10px; border-top-right-radius: 10px; }
.day .fx:last-of-type { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; border-bottom: 1px solid var(--line); }
.fx:hover { background: var(--accent-soft); }
.fx .ko { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.fx .tm { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; min-width: 0; }
.fx .tm .nm { min-width: 0; }
.fx .tm.h { text-align: right; justify-content: flex-end; }
.fx .sc { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.fx .sc.v { font-weight: 500; font-size: 15px; color: var(--muted); }
.fx .stt { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.fx .stt svg { width: 13px; height: 13px; color: var(--ok-text); }
.fx .go { justify-self: end; font-weight: 600; font-size: 13px; color: var(--accent); }
@media (max-width: 720px) {
  .fx { grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr); row-gap: 4px; }
  .fx .ko { grid-column: 1 / 3; grid-row: 2; }
  .fx .stt { grid-column: 3; grid-row: 2; justify-self: end; }
  .fx .go { display: none; }
}

/* ---------- match screen ---------- */
.back { align-self: flex-start; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
.board .side { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 4.4vw, 34px); line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em; display: flex; align-items: center; gap: 14px; overflow-wrap: anywhere; min-width: 0; }
.board .side.h { justify-content: flex-end; text-align: right; }
.board .nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
/* the crests flank the score; on a phone each stands above its club's name */
.board .crest { width: clamp(32px, 5.4vw, 46px); height: clamp(32px, 5.4vw, 46px); object-position: left center; }
.board .side.h .crest { object-position: right center; }
@media (max-width: 560px) {
  .board .side { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; }
  .board .side.h { align-items: flex-end; justify-content: flex-start; }
  .board .side.h .crest { order: -1; }
  .board .crest { width: 36px; height: 36px; }
}
.board .score { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 9vw, 68px); line-height: 0.95; letter-spacing: 0.02em; white-space: nowrap; }
.board .xgl { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13.5px; }
.board .xgl.h { text-align: right; }
.board .mid { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
/* the public page's scorers, between the score and the xG: home under home, away under away, a line per scorer */
.board .scorers { list-style: none; margin: 4px 0 8px; padding: 0; min-width: 0; align-self: start; font-size: 14px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; }
.board .scorers.h { text-align: right; }
.board .scorers li + li { margin-top: 2px; }
.board .scorers .who { font-weight: 500; }
.board .scorers .min { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) { .board .scorers li + li { margin-top: 6px; } }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; color: var(--ink-2); font-size: 13px; }
.keepers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
@media (max-width: 560px) { .keepers { grid-template-columns: minmax(0, 1fr); } }
.tag-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .tag-grid { grid-template-columns: minmax(0, 1fr); } }
.step { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.step .hint { color: var(--muted); font-size: 12.5px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .wide { grid-column: 1 / -1; }
@media (max-width: 420px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
/* under the tagging pitch: the button that shows the match's other shots, and their key while they show */
.pitch-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.pitch-foot .legend { margin-top: 0; justify-content: flex-start; }
.readout { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.readout .xg { display: flex; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.readout .figure { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.readout .unit { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.errs { margin: 0; padding: 8px 12px 8px 28px; border-radius: 8px; background: var(--danger-soft); color: var(--ink); font-size: 13.5px; }
.flash { color: var(--ok-text); font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.flash svg { width: 14px; height: 14px; }

/* pitch and goal drawings */
.viz { position: relative; width: 100%; max-width: 560px; margin-inline: auto; }
.viz svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.viz.pickable svg { cursor: crosshair; }
.turf { fill: var(--surface); }
.pl { fill: none; stroke: var(--line-2); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.pl-dot { fill: var(--line-2); }
.frame { fill: none; stroke: var(--ink); stroke-width: 4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.net { fill: none; stroke: var(--line); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.ground { fill: none; stroke: var(--line-2); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.mk-ring { fill: var(--surface); }
.mk-dot { fill: var(--home); fill-opacity: 0.24; stroke: var(--home); stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
.mk.away .mk-dot { fill: var(--away); stroke: var(--away); }
.mk.goal .mk-dot { fill-opacity: 1; stroke: none; }
.mk-hit { fill: transparent; stroke: none; cursor: default; outline: none; }
.viz.linked .mk-hit { cursor: pointer; }
/* a map linked to the worm and the list picks shots by nearness on the drawing itself, so its circles take no pointer
   (they still take keyboard focus) */
.shotmap-card .viz .mk-hit { pointer-events: none; }
.shotmap-card .viz.pointing svg { cursor: pointer; }
.mk:hover .mk-dot, .mk.focus .mk-dot { fill-opacity: 0.55; }
.mk.goal:hover .mk-dot, .mk.goal.focus .mk-dot { fill-opacity: 0.8; }
.mk.focus .mk-ring, .mk.active .mk-ring { fill: var(--ink); }
/* a shot picked out from the worm or the list (or pointed at here): ringed in ink, every other shot faded back */
.mk.lit .mk-ring { fill: var(--ink); }
.mk.lit .mk-dot { fill-opacity: 0.55; }
.mk.lit.goal .mk-dot { fill-opacity: 1; }
.viz.dim .mk:not(.lit) { opacity: 0.22; }
@media (prefers-reduced-motion: no-preference) { .mk { transition: opacity 0.12s ease; } }
/* the public page's line from a shot to where it ended up, for the shot being pointed at or picked out: in the side's
   colour, under the shots, with a small ring on top where it ended. Neither ever takes the pointer from a shot. */
.trail { fill: none; stroke: var(--home); stroke-width: 2px; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.trail.away { stroke: var(--away); }
.trail-end { fill: var(--surface); stroke: var(--home); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.trail-end.away { stroke: var(--away); }
/* a match's map on the public page: the whole pitch with the two sides at opposite ends, each named at the end it attacks.
   Lying across it is drawn about as large per yard as a half pitch; standing upright on a phone it fills the width. */
.viz.full.across { max-width: 800px; }
.viz.full.upright { max-width: 420px; }
.pitch-wrap { display: flex; flex-direction: column; gap: 6px; }
.pitch-wrap .ends { display: flex; justify-content: space-between; gap: 12px; width: 100%; margin-inline: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* ============================================================
   THE MODEL
   Pitch coordinates follow the StatsBomb convention: the attacking
   goal is at x = 120, the pitch is 80 wide, goal centre at y = 40,
   posts at y = 36 and 44. One unit is one yard inside the box.
   ============================================================ */
const Model = (() => {
  const PEN_SPOT = { x: 108, y: 40 };
  const sigmoid = (v) => 1 / (1 + Math.exp(-v));
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

  /* distance to the centre of the goal (yards) and the angle the goal mouth covers (radians) */
  function geom(x, y) {
    const dx = Math.max(120 - x, 0);
    const dist = Math.hypot(dx, y - 40);
    const angle = Math.abs(Math.atan2(44 - y, dx) - Math.atan2(36 - y, dx));
    return { dist, angle };
  }

  /* the inputs the model actually uses for a shot: penalties and direct free kicks ignore the open-play details */
  function norm(s) {
    const sit = s.sit || "open";
    if (sit === "pen") return { x: PEN_SPOT.x, y: PEN_SPOT.y, head: 0, other: 0, fk: 0, pen: 1, oo: 0, og: 0, ast: "none" };
    if (sit === "fk") return { x: s.x, y: s.y, head: 0, other: 0, fk: 1, pen: 0, oo: 0, og: 0, ast: "none" };
    return {
      x: s.x, y: s.y,
      head: s.body === "head" ? 1 : 0,
      other: s.body === "other" ? 1 : 0,
      fk: 0, pen: 0,
      oo: s.oo ? 1 : 0,
      og: s.og ? 1 : 0,
      ast: s.ast || "none",
    };
  }

  /* chance quality on the model's raw scale, before it is matched to the official numbers. xG on target starts from this
     too; for a penalty it uses the penalty value it was fitted with (penFit), so matching xG changed nothing there. */
  function xgLin(s) {
    const m = MODEL.xg, b = m.b, n = norm(s);
    if (n.pen) { const pf = m.penFit || m.pen; return Math.log(pf / (1 - pf)); }
    const g = geom(n.x, n.y);
    const dc = clamp(g.dist, m.lo, m.cap);

      + b.head * n.head + b.other_body * n.other + b.head_dist * n.head * dc
      + b.is_fk * n.fk + b.fk_dist * n.fk * dc
      + b.one_on_one * n.oo + b.open_goal * n.og
      + (n.ast === "cross" ? b.a_cross : 0) + (n.ast === "through" ? b.a_through : 0)
      + (n.ast === "corner" ? b.a_corner : 0) + (n.ast === "fk" ? b.a_freekick : 0);
  }

  /* expected goals: the chance of scoring before the shot is struck, matched to the official xG of ISL goals (calA, calB),
     less a little for a direct free kick and for a shot from a through ball, which the official numbers rate lower */
  function xg(s) {

    if (s.sit === "pen") return m.pen;

  }

  /* expected goals on target: the chance of scoring given where the shot was placed.
     0 for shots that miss or are blocked, null if an on-target shot has no placement recorded.
     A header has its own placement terms: aimed low it is harder to save than a shot with the foot, aimed high easier,
     and the corners help it more. */
  function xgot(s) {
    if (!onTarget(s)) return 0;
    if (s.gy == null || s.gz == null) return null;

      + g.dc * dc + g.logd * Math.log(dc) + g.is_pen * n.pen + g.one_on_one * n.oo + g.open_goal * n.og
      + g.ay2_logd * ay * ay * Math.log(dc)
      + (g.head || 0) * n.head + (g.head_ay2 || 0) * n.head * ay * ay + (g.head_gz || 0) * n.head * gz;

  }

  return { PEN_SPOT, GOAL_H: MODEL.ps.goalH, geom, xgLin, xg, xgot, onTarget, inBox, clamp };
})();

/* ============================================================
   SEASON TOTALS
   Everything on the Players, Keepers, Teams and Method tabs is
   worked out here from the tagged shots. Nothing is stored
   pre-calculated, so changing a tag updates every number.
   ============================================================ */
const Stats = (() => {
  const other = (side) => (side === "h" ? "a" : "h");

  /* the real scoreline of one match: goals from tagged shots plus own goals */
  function score(match) {
    const sc = { h: 0, a: 0 };
    for (const s of match.shots || []) if (s.out === "goal") sc[s.t] += 1;
    for (const o of match.og || []) sc[o.t] += 1;
    return sc;
  }

  /* each club's results, from the final score of every match with anything tagged in it (the same matches its Matches count
     covers): a win is three points, a draw one each, a defeat none. The public page carries finished matches only, so there
     these are the points from finished matches. */
  function results(matches) {
    const out = {};
    const add = (tid, mine, theirs) => {
      const r = out[tid] || (out[tid] = { w: 0, d: 0, l: 0, pts: 0 });
      if (mine > theirs) { r.w += 1; r.pts += 3; } else if (mine === theirs) { r.d += 1; r.pts += 1; } else r.l += 1;
    };
    for (const m of Object.values(matches)) {
      if (!(m.shots || []).length && !(m.og || []).length) continue;
      const sc = score(m);
      add(m.home, sc.h, sc.a);
      add(m.away, sc.a, sc.h);

  }

  /* shots, on target, goals and xG for each side of one match */
  function matchSummary(match) {
    const mk = () => ({ sh: 0, sot: 0, g: 0, xg: 0, xgot: 0, og: 0 });
    const out = { h: mk(), a: mk() };
    for (const s of match.shots || []) {

      t.sh += 1;
      if (Model.onTarget(s)) t.sot += 1;
      if (s.out === "goal") t.g += 1;
      t.xg += Model.xg(s);
      t.xgot += Model.xgot(s) || 0;

    for (const o of match.og || []) out[o.t].og += 1;

     Level on xG, more goals go first, then more shots, then whoever shot first in the list. A row is a player for one side,
     so a name tagged for both sides by mistake shows twice rather than mixing the two. */
  function matchPlayers(match) {
    const by = new Map();
    (match.shots || []).forEach((s, i) => {

      if (!by.has(key)) by.set(key, { p: s.p, t: s.t, sh: 0, xg: 0, g: 0, first: i });

      r.sh += 1;
      r.xg += Model.xg(s);
      if (s.out === "goal") r.g += 1;

  function scorers(match) {
    const goals = [];
    (match.shots || []).forEach((s, i) => { if (s.out === "goal") goals.push({ t: s.t, p: s.p, og: false, min: s.min == null ? null : s.min, pen: s.sit === "pen", rank: 0, order: i }); });
    (match.og || []).forEach((o, i) => goals.push({ t: o.t, p: o.p || null, og: true, min: o.min == null ? null : o.min, pen: false, rank: 1, order: i }));
    const late = (g) => (g.min == null ? 1 : 0);
    goals.sort((a, b) => late(a) - late(b) || (a.min || 0) - (b.min || 0) || a.rank - b.rank || a.order - b.order);

    for (const g of goals) {
      if (!out[g.t]) continue;
      const key = g.t + "|" + (g.og ? "og:" + (g.p || "") : "p:" + g.p) + (g.min == null ? "|untimed" : "");
      let e = seen[key];
      if (!e) { e = seen[key] = { p: g.p, og: g.og, timed: g.min != null, goals: [] }; out[g.t].push(e); }
      e.goals.push({ min: g.min, pen: g.pen });
    }
    return out;
  }

  /* one match in the order it happened: every shot and own goal, with each side's running xG and the score after it.
     A shot or own goal saved without a minute cannot be placed in time, so those come back separately.
     steps holds, for each side, the running xG after every minute in which that side had a shot. */
  function timeline(match) {
    const rows = [];
    (match.shots || []).forEach((s, i) => rows.push({ kind: "shot", id: s.id, t: s.t, min: s.min == null ? null : s.min, order: i, xg: Model.xg(s), goal: s.out === "goal", shot: s }));
    (match.og || []).forEach((o, i) => rows.push({ kind: "og", id: o.id, t: o.t, min: o.min == null ? null : o.min, order: i, xg: 0, goal: true, shot: null, p: o.p || null }));
    const rank = (r) => (r.kind === "shot" ? 0 : 1);
    const timed = rows.filter((r) => r.min != null).sort((a, b) => a.min - b.min || rank(a) - rank(b) || a.order - b.order);
    const untimed = rows.filter((r) => r.min == null);

    const tm = (tid) => (T[tid] || (T[tid] = { mp: 0, sh: 0, sot: 0, g: 0, xg: 0, xgot: 0, sha: 0, sota: 0, ga: 0, xga: 0, xgota: 0, ogf: 0, oga: 0 }));

      const mt = matches[mid];
      const shots = mt.shots || [], ogs = mt.og || [];
      if (!shots.length && !ogs.length) continue;
      totals.matches += 1;
      const side = { h: mt.home, a: mt.away };
      tm(side.h).mp += 1;
      tm(side.a).mp += 1;
      for (const o of ogs) {
        tm(side[o.t]).ogf += 1;
        tm(side[other(o.t)]).oga += 1;
        /* the keeper in goal for the side that conceded it (set at the top of the match) let it in too. It counts in his
           goals against; his saves, xGOT faced and goals prevented are about shots on target, so it stays out of those. */
        const kid = mt.gk && mt.gk[other(o.t)];
        if (kid) { const k = kp(kid, side[other(o.t)]); k._m.add(mid); k.oga += 1; } else totals.ogunassigned += 1;
      }
      for (const s of shots) {
        const tid = side[s.t], opp = side[other(s.t)];
        const xg = Model.xg(s);
        let xgot = Model.xgot(s);
        const on = Model.onTarget(s), goal = s.out === "goal" ? 1 : 0, pen = s.sit === "pen";
        if (xgot == null) { totals.noplace += 1; xgot = 0; }

        const p = pl(s.p, tid);
        p._m.add(mid);
        p.sh += 1; p.sot += on ? 1 : 0; p.g += goal; p.xg += xg; p.xgot += xgot;
        if (pen) { p.pens += 1; p.pg += goal; } else { p.npxg += xg; p.npsh += 1; }

        if ((s.sit || "open") === "open" && s.ap) {
          const a = pl(s.ap, tid);
          a._m.add(mid);
          a.kp += 1; a.a += goal; a.xa += xg;
        }

        if (on) {
          if (s.k) {
            const k = kp(s.k, opp);
            k._m.add(mid);
            k.sotf += 1; k.ga += goal; k.xgotf += xgot;
          } else {
            totals.unassigned += 1;
          }
        }

        const t = tm(tid), o = tm(opp);
        t.sh += 1; t.sot += on ? 1 : 0; t.g += goal; t.xg += xg; t.xgot += xgot;
        o.sha += 1; o.sota += on ? 1 : 0; o.ga += goal; o.xga += xg; o.xgota += xgot;

        totals.shots += 1; totals.goals += goal; totals.xg += xg;

        const keys = pen ? ["all", "pen"] : ["all", "np"];
        if (!pen) {
          keys.push(Model.inBox(s.x, s.y) ? "inbox" : "outbox");
          if ((s.sit || "open") === "open" && s.body === "head") keys.push("head");
        }
        for (const k of keys) { check[k].n += 1; check[k].g += goal; check[k].xg += xg; }
        if (on && s.gy != null && s.gz != null) { check.ot.n += 1; check.ot.g += goal; check.ot.xg += xgot; }
      }
    }
    for (const d of Object.values(P)) { d.m = d._m.size; delete d._m; }
    for (const d of Object.values(K)) { d.m = d._m.size; delete d._m; }
    return { players: P, keepers: K, teams: T, check, totals };
  }

  return { score, results, matchSummary, matchPlayers, scorers, timeline, timelineAt, aggregate };
})();

/* ============================================================
   THE PUBLIC PAGE
   The tracker can save a read-only copy of itself: one web page with every finished match baked in,
   which can be hosted anywhere and needs no sign-in. That copy runs this same code. The only difference
   is that it starts with window.__READER__ set to the saved data, which switches off everything that
   edits, hides the tagging screens and the Squads tab, and counts finished matches only.
   ============================================================ */
const READER = (typeof window !== "undefined" && window.__READER__ && typeof window.__READER__ === "object") ? window.__READER__ : null;

const Reader = (() => {
  /* where the data goes in the page template. Written in two halves so this file never contains the marker itself. */
  const MARK = "/*__READER" + "_DATA__*/null";

  /* what goes public: finished matches only, every club's name, and only the players who appear in those matches
     (shooters, the players who set them up, keepers, and anyone who put the ball into his own net) */
  function data(teams, matches, now) {
    const outM = {}, used = new Set();
    for (const id of Object.keys(matches)) {
      const m = matches[id];
      if (!m || !m.done) continue;
      const gk = m.gk || {};
      outM[id] = {
        date: m.date, ko: m.ko, home: m.home, away: m.away, venue: m.venue, done: true, gk: { h: gk.h || null, a: gk.a || null },
        shots: (m.shots || []).map((s) => Object.assign({}, s)), og: (m.og || []).map((o) => Object.assign({}, o)),
      };
      if (gk.h) used.add(gk.h);
      if (gk.a) used.add(gk.a);
      for (const s of m.shots || []) { used.add(s.p); if (s.ap) used.add(s.ap); if (s.k) used.add(s.k); }
      for (const o of m.og || []) if (o.p) used.add(o.p);
    }
    const outT = {};
    for (const id of Object.keys(teams)) {
      const t = teams[id];
      outT[id] = { name: t.name, short: t.short, players: (t.players || []).filter((p) => used.has(p.id)).map((p) => ({ id: p.id, name: p.name, num: p.num })) };
    }
    return { v: 1, generated: now, teams: outT, matches: outM };
  }

  /* finished matches, and matches that have shots but are not marked finished (those stay private) */
  function counts(matches) {
    let done = 0, open = 0;
    for (const m of Object.values(matches)) {
      if (m.done) done += 1;
      else if ((m.shots || []).length || (m.og || []).length) open += 1;
    }
    return { done, open };
  }

  /* drop the data into the page template. Every "<" is written as an escape, so nothing in a name can end the script early. */
  function page(template, d) {
    if (typeof template !== "string") return null;
    const at = template.indexOf(MARK);
    if (at < 0 || template.indexOf(MARK, at + MARK.length) >= 0) return null;
    const json = JSON.stringify(d).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    return template.slice(0, at) + json + template.slice(at + MARK.length);
  }

  /* a GitHub repository written as owner/name, and the two addresses that follow from it.
     branch is the branch GitHub serves the page from: main unless the setting says otherwise. */
  function site(repo, branch) {
    const m = /^\s*(?:https?:\/\/github\.com\/)?([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}))\/([A-Za-z0-9._-]{1,100}?)(?:\.git)?\/?\s*$/.exec(String(repo || ""));
    if (!m) return null;
    const owner = m[1], name = m[2];
    const home = name.toLowerCase() === owner.toLowerCase() + ".github.io";
    const br = typeof branch === "string" && /^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(branch) ? branch : "main";
    return {
      repo: owner + "/" + name, branch: br,
      url: "https://" + owner.toLowerCase() + ".github.io/" + (home ? "" : name + "/"),
      upload: "https://github.com/" + owner + "/" + name + "/upload/" + br,
    };
  }

  return { MARK, data, counts, page, site };
})();

/* ============================================================
   CLUB COLOURS (the public page)
   Each club's own colour, and a change colour for when two clubs' colours are too alike to tell apart, each as
   [light page, dark page]. They were checked with the colour validator for every one of the 156 home/away pairings,
   in both modes: lightness within the band, strength above the grey floor, and the two sides of every match apart
   by at least 8 (OKLab \u0394E) under red-green colour blindness and 15 with full colour vision.
   The home side always wears its own colour. The away side wears its own too, except in the pairings listed in
   CLUB_SWITCH (home|away), where it wears its change colour, as a club does with a clashing kit.
   A club not listed here (one added later) leaves the match in the page's standard blue and orange.
   ============================================================ */
const CLUB_COLOURS = {
  bfc:    { own: ["#1541b6", "#3461c9"], change: ["#bd615b", "#cd7670"] },   // Bengaluru FC: royal blue; change soft red
  cfc:    { own: ["#168be1", "#4098e3"], change: ["#7e5e01", "#8c6801"] },   // Chennaiyin FC: blue; change dark gold
  cbfc:   { own: ["#b10412", "#c1332f"], change: ["#2b9667", "#4ca77b"] },   // Churchill Brothers: red; change green
  scd:    { own: ["#8b2241", "#a23954"], change: ["#258651", "#54a674"] },   // SC Delhi: maroon; change green
  ebfc:   { own: ["#c8942d", "#bb881a"], change: ["#93126b", "#d663a9"] },   // East Bengal: gold; change magenta
  mbsg:   { own: ["#2d8c57", "#4ca871"], change: ["#8a3346", "#a45160"] },   // Mohun Bagan: green; change maroon
  mcfc:   { own: ["#32a5d4", "#3a9ec8"], change: ["#483eb5", "#5f5dcb"] },   // Mumbai City: sky blue; change indigo
  fcg:    { own: ["#cf5604", "#e36927"], change: ["#348ff9", "#4293f5"] },   // FC Goa: orange; change blue
  ikfc:   { own: ["#e1901f", "#c97f14"], change: ["#207fe8", "#4293f5"] },   // Inter Kashi: saffron; change blue
  pfc:    { own: ["#f3821d", "#da720d"], change: ["#348ff9", "#4293f5"] },   // Punjab FC: tangerine; change blue
  kbfc:   { own: ["#b79e04", "#a99202"], change: ["#348ff9", "#166dcc"] },   // Kerala Blasters: yellow; change blue
  neufc:  { own: ["#ea3037", "#d73337"], change: ["#0599df", "#099ce4"] },   // NorthEast United: bright red; change blue
  ofc:    { own: ["#663a99", "#734ba4"], change: ["#a17904", "#b88a06"] },   // Odisha FC: purple; change gold
};
const CLUB_SWITCH = new Set([
  "bfc|ofc", "cbfc|fcg", "cbfc|neufc", "cbfc|pfc", "cbfc|scd", "cfc|mcfc", "ebfc|fcg", "ebfc|ikfc",
  "ebfc|kbfc", "ebfc|neufc", "ebfc|pfc", "fcg|cbfc", "fcg|ebfc", "fcg|ikfc", "fcg|kbfc", "fcg|neufc",
  "fcg|pfc", "ikfc|ebfc", "ikfc|fcg", "ikfc|kbfc", "ikfc|pfc", "kbfc|ebfc", "kbfc|fcg", "kbfc|ikfc",
  "kbfc|mbsg", "kbfc|pfc", "mbsg|kbfc", "mbsg|mcfc", "mcfc|cfc", "mcfc|mbsg", "neufc|cbfc", "neufc|ebfc",
  "neufc|fcg", "neufc|pfc", "neufc|scd", "ofc|bfc", "pfc|cbfc", "pfc|ebfc", "pfc|fcg", "pfc|ikfc",
  "pfc|kbfc", "pfc|neufc", "scd|cbfc", "scd|neufc",
]);
/* the shots a club conceded, on its own card's map on the Teams tab: one warm grey for every club, [light page, dark page].
   The two ends of the pitch already keep them apart from the club's own shots, and the grey was still checked against every
   club's own colour with the same validator: at least 15 apart with full colour vision in both modes, at least 8 under
   red-green colour blindness on the dark page and 7.1 on the light one (within the band that is fine with a second cue, here
   the end of the pitch), and 3:1 or more against the pitch in both. A plain grey cannot clear all that on the light page,
   hence the touch of warmth. */
const CONCEDED = ["#72646b", "#b9a9ad"];
const ClubColours = {
  /* the two colours a match is drawn in, as CSS custom properties for the page around it; null keeps blue and orange */
  match(homeId, awayId) {
    const H = CLUB_COLOURS[homeId], A = CLUB_COLOURS[awayId];
    if (!H || !A || homeId === awayId) return null;
    const away = CLUB_SWITCH.has(homeId + "|" + awayId) ? A.change : A.own;
    return { "--ch-l": H.own[0], "--ch-d": H.own[1], "--ca-l": away[0], "--ca-d": away[1] };
  },
  /* one club on its own (a player's or a keeper's shot map): its own colour, in the home slot */
  club(id) {
    const C = CLUB_COLOURS[id];
    return C ? { "--ch-l": C.own[0], "--ch-d": C.own[1] } : null;
  },
  /* a club's season on its card: its own colour in the home slot for the shots it took, the grey in the away slot for the
     shots it conceded. A club with no colours keeps the standard blue for its own. */
  season(id) {
    return Object.assign({}, ClubColours.club(id) || {}, { "--ca-l": CONCEDED[0], "--ca-d": CONCEDED[1] });
  },
};

   DATA

     { id, t: "h"|"a", p, min, x, y, out, body, sit, ast, ap, oo, og, gy, gz, ww, ex, ey, k }

     { id, t: the side it counts for, p: the player who put it in (from the other side) or null, min }

function onFrame(gy, gz) {
  const H = Model.GOAL_H, r2 = (v) => Math.round(v * 100) / 100;
  const up = Model.clamp(gz, 0, H), across = Model.clamp(gy, -4, 4);
  const d = { left: Math.hypot(gy + 4, gz - up), right: Math.hypot(gy - 4, gz - up), bar: Math.hypot(gy - across, gz - H) };
  const ww = d.bar <= d.left && d.bar <= d.right ? "bar" : d.left <= d.right ? "left" : "right";
  return ww === "bar" ? { ww, gy: r2(across), gz: H } : { ww, gy: ww === "left" ? -4 : 4, gz: r2(up) };

/* a sortable table. A column can name what settles a tie in it (then: more values, each sorted the same way round), as points
   in a league table go to goal difference and then goals scored */
function SortTable({ cols, rows, initial, rowKey, onRow, selKey, caption, className }) {
  const [sort, setSort] = useState(initial);
  const sorted = useMemo(() => {
    const c = cols.find((x) => x.key === sort.key) || cols[0];
    const by = (get) => (a, b) => {
      const va = get(a), vb = get(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === "string" || typeof vb === "string") return sort.dir * String(va).localeCompare(String(vb));
      return sort.dir * (va - vb);
    };
    const keys = [c.get].concat(c.then || []).map(by);
    return [...rows].sort((a, b) => { for (const k of keys) { const d = k(a, b); if (d) return d; } return 0; });
  }, [rows, sort, cols]);
  const flip = (c) => setSort((s) => (s.key === c.key ? { key: c.key, dir: -s.dir } : { key: c.key, dir: c.num ? -1 : 1 }));
  return h(TblWrap, null,
    h("table", { className: "tbl" + pinned() + (className ? " " + className : "") },

function toCsv(header, rows) {

        h("th", { className: "num", scope: "col" }, "xG"), h("th", { className: "num", scope: "col", title: "xG on target" }, "xGOT"), h("th", { scope: "col" }, "Set up by"), h("th", { scope: "col" }, "Keeper"),
        can ? h("th", { scope: "col" }, h("span", { className: "sr" }, "Actions")) : null)),
      h("tbody", null, ordered.map((x) => {

          h("td", { className: "strong" }, pname(idx, x.p)),
          h("td", null, shotLine(x), !shotEnd(x) ? h("span", { className: "faint" }, " \u00b7 end not placed") : null),
          h("td", { className: "num" }, f2(Model.xg(x))),
          h("td", { className: "num" }, Model.onTarget(x) ? (ot == null ? "Not placed" : f2(ot)) : ""),

      })))) : h("p", { className: "sub" }, can ? "Shots you save appear here, and you can edit or delete them." : "No shots tagged for this match yet."));

  /* two views of the same match: the tagging screen, and the timeline that reads it back */
  const views = [{ value: "tag", label: can ? "Tag shots" : "Shot map" }, { value: "timeline", label: "Timeline" }];
  const viewBar = h("div", { className: "seg", role: "group", "aria-label": "Match view" },
    views.map((v) => h("button", { key: v.value, type: "button", className: "seg-btn" + (view === v.value ? " on" : ""), "aria-pressed": view === v.value, onClick: () => onView(v.value) }, v.label)));
  /* the public page shows a match as its totals, its top players by xG and its timeline, nothing else */
  if (s.reader) {
    const short = { h: tshort(s.teams, m.home), a: tshort(s.teams, m.away) };
    const totalsCard = h("div", { className: "card stack tight totals-card" },
      h("h2", { className: "h2" }, "Match totals"),
      totalsTable(sc, sum, short));
    const top = Stats.matchPlayers(m).slice(0, TOP_N);
    const topCard = h("div", { className: "card stack tight top-card" },
      h("h2", { className: "h2" }, "Most xG"),
      top.length ? topTable(idx, top, short) : h("p", { className: "sub" }, "No shots in this match."));

}

/* ============================================================
   MATCH TIMELINE: the xG worm and the shot-by-shot list
   ============================================================ */

/* a rough width for a piece of text at a given size, erring wide, so a label can be checked for room before it is drawn */
function textW(str, px) {
  let em = 0;
  for (const ch of String(str)) {
    if (" .,:;'|!il\u2032".indexOf(ch) >= 0) em += 0.32;
    else if ("jtfrI()-\u2013".indexOf(ch) >= 0) em += 0.42;
    else if ("mwMW".indexOf(ch) >= 0) em += 0.92;
    else if (ch >= "A" && ch <= "Z") em += 0.7;
    else if (ch >= "0" && ch <= "9") em += 0.62;
    else em += 0.59;
  }
  return em * px;
}
/* the name to print beside a goal: the nickname in brackets when the squad list has one, otherwise the name as saved */
const goalName = (name) => { const m = /\(([^)]+)\)\s*$/.exec(name || ""); return m ? m[1] : name; };
/* the same for an own goal: the player who put it in, marked (og), or plain "Own goal" when nobody was named */
const ogName = (idx, p) => (p ? goalName(pname(idx, p)) + " (og)" : "Own goal");
const WORM_LABEL_PX = 11.5, WORM_END_PX = 12;

/* everything the worm needs to draw itself at a given width, in pixels.
   The lines are stepped: flat until a shot, then straight up by that shot's xG. */
function wormLayout(tl, width, sides, nameOf) {
  const narrow = width < 480;
  const W = Math.max(Math.round(width), 260), H = Math.round(Math.min(Math.max(W * 0.46, 230), 360));
  const endW = narrow ? textW("0.00", WORM_END_PX) : Math.max(textW(sides.h.short, WORM_END_PX), textW(sides.a.short, WORM_END_PX)) + 5 + textW("0.00", WORM_END_PX);
  const mg = { l: 38, r: Math.ceil(10 + endW + 6), t: 24, b: 28 };
  const pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
  const xEnd = Math.min(Math.max(90, Math.ceil((tl.last == null ? 0 : tl.last) / 5) * 5), 130);
  const top = Math.max(tl.placed.h, tl.placed.a);
  const step = top <= 1 ? 0.25 : top <= 2 ? 0.5 : top <= 5 ? 1 : 2;
  const yMax = Math.max(1, Math.ceil(top / step - 1e-9) * step);
  const x = (min) => mg.l + (Math.min(Math.max(min, 0), xEnd) / xEnd) * pw;
  const y = (v) => mg.t + ph - (Math.min(Math.max(v, 0), yMax) / yMax) * ph;
  const yTicks = [], xTicks = [];
  for (let i = 0; i * step <= yMax + 1e-9; i++) yTicks.push(Math.round(i * step * 100) / 100);
  for (let v = 0; v <= xEnd; v += 15) xTicks.push(v);
  const yLabel = (v) => (v === 0 ? "0" : step < 0.5 ? v.toFixed(2) : v.toFixed(1));

  /* the two lines sit a pixel either side of the true height, so when the teams are level (as at kick-off) both still show */
  const nudge = { h: -1, a: 1 };
  const points = (side) => {
    const yy = (v) => y(v) + nudge[side];
    const out = [[x(0), yy(0)]];
    let v = 0;
    for (const p of tl.steps[side]) { out.push([x(p.min), yy(v)], [x(p.min), yy(p.v)]); v = p.v; }
    out.push([x(xEnd), yy(v)]);
    return out;
  };
  const pts = { h: points("h"), a: points("a") };
  const path = (P) => P.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

  const goals = tl.timed.filter((r) => r.goal).map((r) => ({
    id: r.kind + r.id, side: r.t, og: r.kind === "og", cx: x(r.min), cy: y(r.cum[r.t]) + nudge[r.t], text: nameOf(r) + " " + r.min + "\u2032",
  }));
  const ht = { x: x(45), y: mg.t - 6 };
  /* on a phone there is room for a name or two at most, which reads as if the other goals mattered less: show markers only there */
  const labels = narrow ? [] : placeGoalLabels(goals, [pts.h, pts.a], { x0: mg.l + 2, x1: mg.l + pw - 2, y0: 1, y1: mg.t + ph - 2 },
    [{ x0: ht.x - 11, x1: ht.x + 11, y0: ht.y - 12, y1: ht.y + 4 }]);

  /* the two totals at the right-hand end: beside their own line, eased apart only when the lines finish close together */
  const ends = { h: { x: x(xEnd), y: y(tl.placed.h) + nudge.h }, a: { x: x(xEnd), y: y(tl.placed.a) + nudge.a } };
  const ly = { h: ends.h.y, a: ends.a.y }, gap = 15;
  if (Math.abs(ly.h - ly.a) < gap) {
    const up = ly.h <= ly.a ? "h" : "a", lo = up === "h" ? "a" : "h";
    const mid = (ly.h + ly.a) / 2, maxY = mg.t + ph, minY = mg.t + 4;
    ly[up] = mid - gap / 2; ly[lo] = mid + gap / 2;
    if (ly[lo] > maxY) { ly[up] -= ly[lo] - maxY; ly[lo] = maxY; }
    if (ly[up] < minY) { ly[lo] += minY - ly[up]; ly[up] = minY; }
  }
  return { W, H, mg, pw, ph, xEnd, yMax, x, y, yTicks, xTicks, yLabel, narrow, nudge, d: { h: path(pts.h), a: path(pts.a) }, goals, labels, ht, ends, ly };
}

/* find room for a name beside every goal and own goal: first a corner right beside the marker, as always; failing that,
   the nearest spot pushed sideways or a row or more up or down, joined to its marker by a short leader line (among spots
   equally near, the one furthest from the names already placed). A name never covers another name, a goal marker, a line
   or the HT label, and stays inside the chart, so in a truly crowded corner a name can still be left off; the list under
   the chart always has it. */
function placeGoalLabels(goals, lines, box, extra) {
  const hits = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const crosses = (r, P) => {
    for (let i = 1; i < P.length; i++) {
      const ax = Math.min(P[i - 1][0], P[i][0]), bx = Math.max(P[i - 1][0], P[i][0]), ay = Math.min(P[i - 1][1], P[i][1]), by = Math.max(P[i - 1][1], P[i][1]);
      if (ax <= r.x1 && bx >= r.x0 && ay <= r.y1 && by >= r.y0) return true;
    }
    return false;
  };
  const marks = goals.map((g) => ({ x0: g.cx - 7, x1: g.cx + 7, y0: g.cy - 7, y1: g.cy + 7 }));
  const corners = [["end", -10], ["start", -10], ["start", 19], ["end", 19]];
  const near = corners.map(([anchor, dy]) => ({ anchor, dy, shift: 0, cost: 0 }));
  const far = [];
  for (let k = 0; k <= 10; k++) for (const shift of [0, 12, 24, 36, 48, 60, 72, 84]) {
    if (!k && !shift) continue;
    for (const [anchor, base] of corners) far.push({ anchor, dy: base < 0 ? base - 16 * k : base + 16 * k, shift, cost: 16 * k + shift });
  }
  far.sort((a, b) => a.cost - b.cost);
  const placed = new Map();
  const centre = (r) => [(r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2];
  const room = (r) => Math.min(Infinity, ...[...placed.values()].map((q) => { const a = centre(r), b = centre(q.rect); return Math.hypot(a[0] - b[0], a[1] - b[1]); }));
  const tryAt = (g, gi, spots, apart) => {
    const w = textW(g.text, WORM_LABEL_PX) + 4;
    let best = null;
    for (const c of spots) {
      if (best && c.cost > best.cost) break;
      const x = c.anchor === "end" ? g.cx - 8 - c.shift : g.cx + 8 + c.shift, y = g.cy + c.dy;
      /* the box the text really fills at this size: about 12.5px above its baseline and 3.5px below */
      const r = { x0: c.anchor === "end" ? x - w : x, x1: c.anchor === "end" ? x : x + w, y0: y - 12.5, y1: y + 3.5 };
      if (r.x0 < box.x0 || r.x1 > box.x1 || r.y0 < box.y0 || r.y1 > box.y1) continue;
      if (marks.some((q, qi) => qi !== gi && hits(r, q))) continue;
      if ((extra || []).some((q) => hits(r, q))) continue;
      if ([...placed.values()].some((q) => hits(r, q.rect))) continue;
      if (lines.some((P) => crosses(r, P))) continue;
      const it = { ...c, x, y, r };
      if (!apart) { best = it; break; }
      if (!best || room(r) > room(best.r)) best = it;
    }
    if (!best) return;
    const up = best.dy < 0, lead = apart ?
      { x1: g.cx + (best.anchor === "end" ? -4 : 4), y1: g.cy + (up ? -4 : 4), x2: best.anchor === "end" ? best.r.x1 - 3 : best.r.x0 + 3, y2: up ? best.r.y1 - 1 : best.r.y0 + 1 } : null;
    placed.set(gi, { id: g.id, text: g.text, anchor: best.anchor, x: best.x, y: best.y, rect: best.r, lead });
  };
  for (const [spots, apart] of [[near, false], [far, true]]) goals.forEach((g, gi) => { if (!placed.has(gi)) tryAt(g, gi, spots, apart); });
  return goals.map((g, gi) => placed.get(gi)).filter(Boolean);
}

/* the chart. cursor is { min, py } while a minute is being looked at, from the pointer, the keyboard or the list below
   (on the public page also the shot map). A cursor with no minute, from a shot saved without one, leaves the chart alone.
   linked: the page above puts the cursor away when somewhere else is tapped, so the chart does not do it itself. */
function XgWorm({ tl, sides, idx, cursor, setCursor, linked }) {
  const box = useRef(null);
  const width = useWidth(box, 640);
  const L = useMemo(() => wormLayout(tl, width, sides, (r) => (r.kind === "og" ? ogName(idx, r.p) : goalName(pname(idx, r.shot.p)))), [tl, width, idx, sides.h.short, sides.a.short]);
  const { W, H, mg, pw, ph } = L;
  const eventMins = useMemo(() => [...new Set(tl.timed.map((r) => r.min))], [tl]);
  /* on a touch screen nothing "leaves" the chart, so a tap anywhere else puts the tooltip away */
  const active = !!cursor;
  useEffect(() => {
    if (!active || linked) return undefined;
    const away = (e) => { if (e.pointerType !== "mouse" && box.current && !box.current.contains(e.target)) setCursor(null); };
    document.addEventListener("pointerdown", away);
    return () => document.removeEventListener("pointerdown", away);
  }, [active]);

    return { min: Math.round(Math.min(Math.max((px - mg.l) / pw, 0), 1) * L.xEnd), py };
  };

  const onDown = (e) => { if (e.pointerType !== "mouse" && e.currentTarget.focus) e.currentTarget.focus(); onMove(e); };
  const onLeave = (e) => { if (e.pointerType === "mouse") setCursor(null); };

    let next = null;
    if (e.key === "ArrowLeft") next = [...eventMins].reverse().find((v) => v < cur);
    else if (e.key === "ArrowRight") next = eventMins.find((v) => v > cur);
    else if (e.key === "Home") next = eventMins[0];
    else if (e.key === "End") next = eventMins[eventMins.length - 1];

  const cls = { h: "home", a: "away" };
  const aria = "xG worm. " + sides.h.name + " " + f2(tl.placed.h) + " xG, " + sides.a.name + " " + f2(tl.placed.a) + " xG. Left and right arrow keys step through the shots. The list below has every shot.";
  let tip = null, mark = null;
  if (cursor && cursor.min != null) {
    const v = Stats.timelineAt(tl, cursor.min), cx = L.x(cursor.min);
    const here = tl.timed.filter((r) => r.min === cursor.min);
    const top = Math.min(Math.max(cursor.py == null ? mg.t + ph / 2 : cursor.py, 46), H - 46);
    const leftHalf = cx < W / 2;
    const room = Math.min(260, Math.max((leftHalf ? W - cx : cx) - 16, 130));
    tip = h("div", { className: "tip rows", style: Object.assign({ top, transform: "translateY(-50%)", maxWidth: room }, leftHalf ? { left: cx + 12 } : { right: W - cx + 12 }) },
      h("strong", null, cursor.min + "\u2032"),
      ["h", "a"].map((sd) => h("span", { key: sd, className: "tr" }, h("i", { className: "key " + cls[sd] }), h("b", null, f2(v[sd])), sides[sd].short)),
      here.map((r) => h("span", { key: r.kind + r.id, className: "ev" },
        r.kind === "og" ? "Own goal" + (r.p ? " by " + pname(idx, r.p) : "") + ", counts for " + sides[r.t].short : pname(idx, r.shot.p) + ": " + shotLine(r.shot) + ", " + f2(r.xg) + " xG")));
    mark = h("g", { pointerEvents: "none" },
      h("path", { className: "wc", d: "M" + cx.toFixed(1) + "," + mg.t + " V" + (mg.t + ph) }),
      ["h", "a"].map((sd) => h("circle", { key: sd, className: "wm " + cls[sd], cx, cy: L.y(v[sd]) + L.nudge[sd], r: 4 })));
  }

  return h("div", { className: "worm", ref: box },
    h("svg", {
      viewBox: "0 0 " + W + " " + H, height: H, role: "img", tabIndex: 0, "aria-label": aria,
      onPointerMove: onMove, onPointerDown: onDown, onPointerLeave: onLeave, onKeyDown: onKey, onFocus, onBlur: () => setCursor(null),
    },
      L.yTicks.map((v) => h("g", { key: "y" + v },
        h("path", { className: "wg" + (v === 0 ? " base" : ""), d: "M" + mg.l + "," + L.y(v).toFixed(1) + " H" + (mg.l + pw) }),
        h("text", { className: "wt", x: mg.l - 7, y: L.y(v) + 3.5, textAnchor: "end" }, L.yLabel(v)))),
      h("text", { className: "wt", x: mg.l - 7, y: mg.t - 11, textAnchor: "end" }, "xG"),
      L.xTicks.map((v) => h("text", { key: "x" + v, className: "wt", x: L.x(v), y: mg.t + ph + 17, textAnchor: "middle" }, v + "\u2032")),
      h("path", { className: "wg ht", d: "M" + L.ht.x.toFixed(1) + "," + mg.t + " V" + (mg.t + ph) }),
      h("text", { className: "wt", x: L.ht.x, y: L.ht.y, textAnchor: "middle" }, "HT"),
      h("path", { className: "wl away", d: L.d.a }),
      h("path", { className: "wl home", d: L.d.h }),
      ["a", "h"].map((sd) => h("circle", { key: "e" + sd, className: "wm " + cls[sd], cx: L.ends[sd].x, cy: L.ends[sd].y, r: 4 })),
      L.goals.map((g) => (g.og ?
        h("g", { key: g.id, className: "wgoal og" }, h("circle", { className: "wm-back", cx: g.cx, cy: g.cy, r: 7 }), h("circle", { className: "wm-open " + cls[g.side], cx: g.cx, cy: g.cy, r: 4.5 })) :
        h("circle", { key: g.id, className: "wgoal wm " + cls[g.side], cx: g.cx, cy: g.cy, r: 5 }))),
      L.labels.map((l) => l.lead ? h("path", { key: "lead" + l.id, className: "wlead", d: "M" + l.lead.x1.toFixed(1) + "," + l.lead.y1.toFixed(1) + " L" + l.lead.x2.toFixed(1) + "," + l.lead.y2.toFixed(1) }) : null),
      L.labels.map((l) => h("text", { key: l.id, className: "wn", x: l.x, y: l.y, textAnchor: l.anchor }, l.text)),
      ["h", "a"].map((sd) => h("text", { key: "l" + sd, className: "we", x: L.ends[sd].x + 10, y: L.ly[sd] + 4 },
        L.narrow ? null : h("tspan", null, sides[sd].short),
        h("tspan", { className: "v", dx: L.narrow ? 0 : 5 }, f2(tl.placed[sd])))),
      mark),
    tip);
}

/* the match read back: the xG worm and the shot-by-shot list, and on the public page (withMap) a shot map above them.
   All three share one cursor, so a shot picked out in any of them shows in the others:
     { min, py }                         a minute on the worm, from the pointer, the keyboard or a tap
     { min, py, key, shot, src }         one row of the list (src "list") or one shot on the map (src "map");
                                         min is null for a shot saved without a minute, key is the row, shot the shot's id (null for an own goal)
   The worm marks the minute, the list lights the row (or every row in the worm's minute), the map rings the shot (or every
   shot in that minute) and fades the rest. When the map has scrolled out of sight, a small copy of it shows in the corner. */
function MatchTimeline({ s, idx, m, can, withMap }) {
  const tl = useMemo(() => Stats.timeline(m), [m.shots, m.og]);
  const [cursor, setCursor] = useState(null);
  const mapRef = useRef(null), wormRef = useRef(null), listRef = useRef(null), lastPointer = useRef("mouse");
  const [mapSeen, setMapSeen] = useState(true);
  const linked = !!withMap && (m.shots || []).length > 0;
  /* each shot's pop-up gives its xG and, for a shot on target, its xG on target too (the map is on the public page only) */
  const marks = useMemo(() => (linked ? m.shots.map((x) => {
    const v = Model.xg(x), who = pname(idx, x.p), nb = shotNumbers(x, !!READER);
    return {
      id: x.id, x: x.x, y: x.y, sd: x.t, v, goal: x.out === "goal", cls: x.t === "h" ? "home" : "away", value: nb.value, end: shotEnd(x),
      lines: [who + (x.min != null ? " \u00b7 " + x.min + "\u2032" : ""), shotLine(x)],
      aria: who + (x.min != null ? ", minute " + x.min : "") + ", " + shotLine(x) + ", " + nb.aria,
    };
  }) : []), [linked, m.shots, idx]);
  /* the map is the whole pitch, the two sides at opposite ends: lying across where the card is wide enough for that to read
     (home attacking the left goal), standing upright on a narrow screen (home attacking the top one) */
  const cardW = useWidth(mapRef, typeof window !== "undefined" && window.innerWidth ? window.innerWidth - 40 : 1000);
  const orient = cardW >= 640 ? "across" : "upright";
  /* how the last press came: a mouse click lands on a row the pointer has already picked out, so only a tap toggles it */
  useEffect(() => {
    if (!linked) return undefined;
    const note = (e) => { lastPointer.current = e.pointerType || "mouse"; };
    document.addEventListener("pointerdown", note, true);
    return () => document.removeEventListener("pointerdown", note, true);
  }, [linked]);
  /* on a touch screen nothing is ever "left", so a tap outside the map, the worm and the list puts the cursor away */
  const active = !!cursor;
  useEffect(() => {
    if (!linked || !active) return undefined;
    const away = (e) => {
      if (e.pointerType === "mouse") return;
      if ([mapRef, wormRef, listRef].some((r) => r.current && r.current.contains(e.target))) return;
      setCursor(null);

   METHOD: how to tag, what the numbers mean, the model check, exports

function exportShots(s, idx) {
  const rows = [];
  for (const { id, m } of sortedMatches(s.matches)) for (const x of m.shots) {
    const g = Model.geom(x.x, x.y), ot = Model.xgot(x), end = shotEnd(x);
    rows.push([id, m.date, tname(s.teams, m.home), tname(s.teams, m.away), tname(s.teams, x.t === "h" ? m.home : m.away), tname(s.teams, x.t === "h" ? m.away : m.home),
      x.min, pname(idx, x.p), x.x, x.y, Math.round(g.dist * 10) / 10, x.out, x.out === "post" && WOOD[x.ww] ? WOOD[x.ww].toLowerCase() : "", Model.onTarget(x) ? 1 : 0, x.out === "goal" ? 1 : 0, x.body, x.sit, x.ast,
      pname(idx, x.ap), x.oo ? 1 : 0, x.og ? 1 : 0, r3(Model.xg(x)), x.gy, x.gz, end ? r3(end.x) : "", end ? r3(end.y) : "", Model.onTarget(x) ? r3(ot) : "", pname(idx, x.k)]);
  }
  /* goal_y and goal_z: where an on-target shot crossed the line, or where a shot off the woodwork hit the frame.
     end_x and end_y: where every shot ended up on the pitch, on the same axes as x and y (blank where it was not recorded) */
  return toCsv(["match_id", "date", "home", "away", "team", "opponent", "minute", "player", "x", "y", "distance_yd", "outcome", "woodwork", "on_target", "goal", "body", "situation", "pass_type",
    "set_up_by", "one_on_one", "open_goal", "xg", "goal_y", "goal_z", "end_x", "end_y", "xgot", "keeper"], rows);
}
function exportPlayers(s, idx, agg) {
  const rows = Object.keys(agg.players).map((id) => {
    const d = agg.players[id];
    return [pname(idx, id), tname(s.teams, d.team), d.m, d.sh, d.sot, d.g, r3(d.xg), r3(d.g - d.xg), d.pens, d.pg, r3(d.npxg), r3(d.xgot), d.kp, d.a, r3(d.xa)];
  }).sort((a, b) => b[6] - a[6]);
  return toCsv(["player", "club", "matches_with_a_shot_or_key_pass", "shots", "on_target", "goals", "xg", "goals_minus_xg", "penalties_taken", "penalties_scored", "npxg", "xgot", "key_passes", "assists", "xa"], rows);
}
function exportKeepers(s, idx, agg) {
  const rows = Object.keys(agg.keepers).map((id) => {
    const d = agg.keepers[id];
    /* goals against include own goals, as on the Keepers tab; saves and the expected numbers count shots on target only */
    return [pname(idx, id), tname(s.teams, d.team), d.m, d.sotf, d.ga + d.oga, d.oga, d.sotf - d.ga, r3(d.xgotf), r3(d.sotf - d.xgotf), r3(d.xgotf - d.ga)];
  }).sort((a, b) => b[9] - a[9]);
  return toCsv(["keeper", "club", "matches", "on_target_faced", "goals_against", "own_goals_against", "saves", "xgot_faced", "expected_saves", "saves_above_expected"], rows);
}

/* ============================================================
   THE PAGE SHELL
   ============================================================ */
/* the public page has no Squads tab: squads are a tagging tool */
const TABS = [["matches", "Matches"], ["players", "Players"], ["keepers", "Keepers"], ["teams", "Teams"], ["squads", "Squads"], ["method", "Method"]].filter((t) => !READER || t[0] !== "squads");
const ROUTE_KEY = READER ? "islxg.public.route" : "islxg.route";
/* the public page goes by its own name; the tracker keeps its working name */
const SITE_NAME = READER ? PAGE_NAMES.reader : PAGE_NAMES.tracker;
/* the season sits beside the name, unless the name already says it (the public page is called "ISL 2026-27") */
const SEASON_LABEL = PAGE_NAMES.season || "2026-27";
/* "Updated 9 Oct 2026" from the moment the public page was saved, in the reader's own time zone */
function updatedLabel(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return "";
  return "Updated " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
/* where the page opens. The tracker comes back to wherever you were. The public page always opens on its list of matches
   (or on the tab a link names, like #players), never on the last match a visitor happened to look at. */
function firstRoute(saved) {
  const ok = (r) => r && TABS.some((t) => t[0] === r.tab);
  const keep = (r) => ({ tab: r.tab, matchId: r.matchId || null, view: r.matchId && r.view === "timeline" ? "timeline" : "tag" });
  if (saved && ok(saved.route)) return keep(saved.route);
  const hash = String(window.location.hash || "").replace("#", "");
  if (TABS.some((t) => t[0] === hash)) return { tab: hash, matchId: null, view: "tag" };
  if (READER) {
    try { window.localStorage.removeItem(ROUTE_KEY); } catch (e) { /* nothing was kept */ }
    return { tab: "matches", matchId: null, view: "tag" };
  }
  try {
    const r = JSON.parse(window.localStorage.getItem(ROUTE_KEY) || "null");
    if (ok(r)) return keep(r);
  } catch (e) { /* storage can be unavailable; start on Matches */ }
  return { tab: "matches", matchId: null, view: "tag" };
}

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  render() {
    if (!this.state.failed) return this.props.children;
    return h("div", { className: "wrap" }, h("div", { className: "empty" }, h("strong", null, "This screen hit a problem"), "Reload the page. Everything you saved is safe."));
  }
}

function App({ initial }) {
  const s = useSyncExternalStore(Store.subscribe, Store.get);
  const [route, setRoute] = useState(() => firstRoute(initial));
  const routeRef = useRef(route);
  routeRef.current = route;
  const go = (r) => {
    setRoute(r);
    if (!READER) { try { window.localStorage.setItem(ROUTE_KEY, JSON.stringify(r)); } catch (e) { /* fine without it */ } }
    if (r.tab !== route.tab || r.matchId !== route.matchId) { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }
  };
  useEffect(() => {
    try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ route: routeRef.current })); } catch (e) { /* optional */ }
  }, []);
  const idx = useMemo(() => buildIndex(s.teams), [s.teams]);
  const agg = useMemo(() => Stats.aggregate(s.teams, s.matches), [s.teams, s.matches]);

  let sync = null;
  if (s.phase === "loading") sync = h("span", { className: "sync" }, h(IconDots), "Loading");
  else if (s.phase === "ready") {
    if (s.saveError) sync = h("span", { className: "sync bad" }, h(IconWarn), "Not saved");
    else if (s.saving) sync = h("span", { className: "sync" }, h(IconDots), "Saving");
    else if (s.canWrite) sync = h("span", { className: "sync ok" }, h(IconCheck), "All changes saved");
    else if (s.reader) sync = updatedLabel(s.generated) ? h("span", { className: "sync" }, updatedLabel(s.generated)) : null;
    else sync = h("span", { className: "sync" }, "View only");
  }

  let view;
  if (s.phase === "loading") view = h("div", { className: "empty" }, h("strong", null, "Loading your data"), "One moment.");
  else if (s.phase === "nodb") view = route.tab === "method" ? h(MethodView, { s, idx, agg }) : h("div", { className: "empty" }, h("strong", null, "Your data cannot be reached from here"), "Open this page inside Claude while signed in, and your matches and shots will load.");
  else if (route.tab === "matches") view = route.matchId ? h(MatchView, { s, idx, matchId: route.matchId, view: route.view, onView: (v) => go({ tab: "matches", matchId: route.matchId, view: v }), back: () => go({ tab: "matches", matchId: null }) }) : h(MatchesView, { s, agg, open: (id) => go({ tab: "matches", matchId: id }) });
  else if (route.tab === "players") view = h(PlayersView, { s, idx, agg });
  else if (route.tab === "keepers") view = h(KeepersView, { s, idx, agg });
  else if (route.tab === "teams") view = h(TeamsView, { s, idx, agg });
  else if (route.tab === "squads") view = h(SquadsView, { s });
  else view = h(MethodView, { s, idx, agg });

  return h("div", { className: "wrap" },
    h("header", { className: "mast" },
      h("div", { className: "brand" }, h("h1", null, SITE_NAME), SITE_NAME.indexOf(SEASON_LABEL) < 0 ? h("span", { className: "season" }, SEASON_LABEL) : null),
      h("div", { role: "status", "aria-live": "polite" }, sync)),
    h("nav", { className: "tabs", "aria-label": "Sections" }, TABS.map(([id, label]) => h("button", {
      key: id, type: "button", className: "tab" + (route.tab === id ? " on" : ""), "aria-current": route.tab === id ? "page" : undefined,
      onClick: () => go({ tab: id, matchId: null }),
    }, label))),
    s.saveError ? h(Note, { kind: "bad", action: s.saveError.denied ? null : h("button", { type: "button", className: "btn", onClick: Store.retry }, "Retry") }, s.saveError.message) : null,
    h("main", { className: "stack" }, h(Boundary, { key: route.tab + (route.matchId || "") }, view)),
    route.tab !== "method" ? h("div", { className: "credit" }, h(SbLogo),
      h("p", { className: "foot" }, "xG model built on StatsBomb Open Data. An independent project, not affiliated with the Indian Super League or its clubs.")) : null);
}

(function boot() {
  let started = false;
  const start = (saved) => {
    if (started) return;
    started = true;
    Store.init();
    ReactDOM.createRoot(document.getElementById("app")).render(h(Boundary, null, h(App, { initial: saved || {} })));
  };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === "function") {
    try { hot.ready(start); } catch (e) { start({}); }
    setTimeout(() => start({}), 2500);
  } else {
    start((hot && hot.data) || {});
  }
})();
</script>
