<style>
/* layout: one working column up to 1180px; the tagging screen splits into pitch | form and stacks on a phone */
:root {
  color-scheme: light;
  --bg: #f3f5f1;
  --surface: #fdfdfb;
  --sunken: #eceee9;
  --ink: #111714;
  --ink-2: #4a514c;
  --muted: #6d746e;
  --line: #dde1da;
  --line-2: #bfc6be;
  --accent: #0f6a45;
  --on-accent: #ffffff;
  --accent-soft: #e2f0e8;
  --home: #2a78d6;
  --away: #eb6834;
  --ok-text: #006300;
  --danger-text: #b42318;
  --danger-soft: #fdecea;
  --warn-soft: #fff4d6;
  --shadow: 0 1px 2px rgba(17, 23, 20, 0.06), 0 6px 20px rgba(17, 23, 20, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1210; --surface: #181d1a; --sunken: #121614; --ink: #f2f5f1; --ink-2: #c2c8c1; --muted: #949b94;
    --line: #2a312c; --line-2: #414a43; --accent: #43b987; --on-accent: #06140d; --accent-soft: #17302a;
    --home: #3987e5; --away: #d95926; --ok-text: #4cc46f; --danger-text: #ff9a8f; --danger-soft: #3a1c19; --warn-soft: #3a3115;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1210; --surface: #181d1a; --sunken: #121614; --ink: #f2f5f1; --ink-2: #c2c8c1; --muted: #949b94;
  --line: #2a312c; --line-2: #414a43; --accent: #43b987; --on-accent: #06140d; --accent-soft: #17302a;
  --home: #3987e5; --away: #d95926; --ok-text: #4cc46f; --danger-text: #ff9a8f; --danger-soft: #3a1c19; --warn-soft: #3a3115;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* the public page stands alone, without the frame Claude wraps around the tracker, so the basics are set here too */
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- masthead ---------- */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
.brand .season { font-family: var(--font-display); font-weight: 500; font-size: 18px; color: var(--muted); letter-spacing: 0.04em; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.sync svg { width: 14px; height: 14px; flex: none; }
.sync.ok { color: var(--ok-text); }
.sync.bad { color: var(--danger-text); }

.tabs { display: flex; gap: 2px 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); }
.tab { appearance: none; background: none; border: 0; padding: 8px 0 9px; margin-bottom: -1px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- notices ---------- */
.note { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--sunken); color: var(--ink-2); font-size: 13.5px; }
.note > span { flex: 1 1 240px; min-width: 0; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.note.bad { background: var(--danger-soft); color: var(--ink); }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: 10px; }
.empty strong { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }

/* ---------- controls ---------- */
.btn { appearance: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 6px 12px; font-weight: 500; line-height: 1.3; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); padding-inline: 6px; }
.btn.quiet:hover { color: var(--ink); text-decoration: underline; }
.btn.danger { color: var(--danger-text); }
.btn.big { padding: 10px 20px; font-size: 15px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field { min-width: 0; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-height: 34px; }
textarea.input { min-height: 110px; resize: vertical; }
.input::placeholder { color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-btn { appearance: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 6px 11px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.seg-btn:hover { border-color: var(--ink-2); }
.seg-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.home { background: var(--home); }
.dot.away { background: var(--away); }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.dot.solid { background: var(--muted); }
.dot.soft { background: color-mix(in srgb, var(--home) 24%, transparent); box-shadow: inset 0 0 0 1.5px var(--home); }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.row > .grow { flex: 1 1 180px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; justify-content: space-between; }

/* player picker */
.pick { position: relative; }
.pick .input { padding-right: 30px; }
.pick-clear { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 5px; font-size: 16px; line-height: 1; }
.pick-clear:hover { color: var(--ink); background: var(--sunken); }
.pick-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); max-height: 260px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); }
.pick-opt { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.pick-opt .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
.pick-opt.hi { background: var(--accent-soft); }
.pick-opt.add { color: var(--ink); font-weight: 500; border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; margin-top: 2px; }
.pick-none { padding: 8px; color: var(--muted); }

/* ---------- cards & headings ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack.tight { gap: 8px; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }
.deflist { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 6px 16px; margin: 0; max-width: 78ch; }
.deflist dt { font-weight: 600; }
.deflist dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .deflist { grid-template-columns: minmax(0, 1fr); gap: 2px; } .deflist dd { margin-bottom: 8px; } }

/* ---------- fixtures ---------- */
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); }
.summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.day { display: flex; flex-direction: column; }
.day-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px; display: flex; align-items: center; gap: 10px; }
.day-h .today { background: var(--accent); color: var(--on-accent); border-radius: 4px; padding: 1px 7px; font-size: 13px; }
.fx { display: grid; grid-template-columns: 74px minmax(0, 1fr) 64px minmax(0, 1fr) minmax(110px, auto) 70px; align-items: center; gap: 8px 12px; padding: 9px 12px; border-top: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; }
.day .fx:first-of-type { border-top-left-radius: 10px; border-top-right-radius: 10px; }
.day .fx:last-of-type { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; border-bottom: 1px solid var(--line); }
.fx:hover { background: var(--accent-soft); }
.fx .ko { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.fx .tm { font-weight: 600; overflow-wrap: anywhere; }
.fx .tm.h { text-align: right; }
.fx .sc { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.fx .sc.v { font-weight: 500; font-size: 15px; color: var(--muted); }
.fx .stt { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.fx .stt svg { width: 13px; height: 13px; color: var(--ok-text); }
.fx .go { justify-self: end; font-weight: 600; font-size: 13px; color: var(--accent); }
@media (max-width: 720px) {
  .fx { grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr); row-gap: 4px; }
  .fx .ko { grid-column: 1 / 3; grid-row: 2; }
  .fx .stt { grid-column: 3; grid-row: 2; justify-self: end; }
  .fx .go { display: none; }
}

/* ---------- match screen ---------- */
.back { align-self: flex-start; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
.board .side { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 4.4vw, 34px); line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em; display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere; min-width: 0; }
.board .side.h { justify-content: flex-end; text-align: right; }
.board .score { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 9vw, 68px); line-height: 0.95; letter-spacing: 0.02em; white-space: nowrap; }
.board .xgl { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13.5px; }
.board .xgl.h { text-align: right; }
.board .mid { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; color: var(--ink-2); font-size: 13px; }
.keepers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
@media (max-width: 560px) { .keepers { grid-template-columns: minmax(0, 1fr); } }
.tag-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .tag-grid { grid-template-columns: minmax(0, 1fr); } }
.step { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.step .hint { color: var(--muted); font-size: 12.5px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .wide { grid-column: 1 / -1; }
@media (max-width: 420px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.readout { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.readout .xg { display: flex; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.readout .figure { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.readout .unit { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.errs { margin: 0; padding: 8px 12px 8px 28px; border-radius: 8px; background: var(--danger-soft); color: var(--ink); font-size: 13.5px; }
.flash { color: var(--ok-text); font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.flash svg { width: 14px; height: 14px; }

/* pitch and goal drawings */
.viz { position: relative; width: 100%; max-width: 560px; margin-inline: auto; }
.viz svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.viz.pickable svg { cursor: crosshair; }
.turf { fill: var(--surface); }
.pl { fill: none; stroke: var(--line-2); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.pl-dot { fill: var(--line-2); }
.frame { fill: none; stroke: var(--ink); stroke-width: 4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.net { fill: none; stroke: var(--line); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.ground { fill: none; stroke: var(--line-2); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.mk-ring { fill: var(--surface); }
.mk-dot { fill: var(--home); fill-opacity: 0.24; stroke: var(--home); stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
.mk.away .mk-dot { fill: var(--away); stroke: var(--away); }
.mk.goal .mk-dot { fill-opacity: 1; stroke: none; }
.mk-hit { fill: transparent; stroke: none; cursor: default; outline: none; }
.viz.linked .mk-hit { cursor: pointer; }
.mk:hover .mk-dot, .mk.focus .mk-dot { fill-opacity: 0.55; }
.mk.goal:hover .mk-dot, .mk.goal.focus .mk-dot { fill-opacity: 0.8; }
.mk.focus .mk-ring, .mk.active .mk-ring { fill: var(--ink); }
.draft-ring { fill: none; stroke: var(--ink); stroke-width: 2.4px; vector-effect: non-scaling-stroke; }
.draft-dot { fill: var(--ink); }
.tip { position: absolute; z-index: 20; pointer-events: none; min-width: 130px; max-width: 220px; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.35; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 1px; }
.tip strong { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip span { opacity: 0.85; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- match timeline: the xG worm ---------- */
.worm { position: relative; width: 100%; }
.worm svg { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; outline: none; }
.worm svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wg { fill: none; stroke: var(--line); stroke-width: 1px; shape-rendering: crispEdges; }
.wg.base, .wg.ht { stroke: var(--line-2); }
.wt { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.wl { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
.wl.home { stroke: var(--home); }
.wl.away { stroke: var(--away); }
.wm { stroke: var(--surface); stroke-width: 2px; paint-order: stroke; }
.wm.home { fill: var(--home); }
.wm.away { fill: var(--away); }
.wm-back { fill: var(--surface); }
.wm-open { fill: var(--surface); stroke-width: 2px; }
.wm-open.home { stroke: var(--home); }
.wm-open.away { stroke: var(--away); }
.wn { fill: var(--ink-2); font-size: 11.5px; font-weight: 500; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke; }
.we { fill: var(--ink-2); font-size: 12px; }
.we .v { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.wc { fill: none; stroke: var(--ink-2); stroke-width: 1px; shape-rendering: crispEdges; }
.tip.rows { gap: 3px; min-width: 130px; }
.tip .tr { display: flex; align-items: center; gap: 7px; opacity: 1; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.5em; }
.tip .ev { border-top: 1px solid color-mix(in srgb, var(--bg) 28%, transparent); padding-top: 4px; margin-top: 2px; }
.tip .ev + .ev { border-top: 0; padding-top: 0; margin-top: 0; }
.key { display: inline-block; flex: none; width: 16px; height: 0; border-top: 2px solid var(--home); border-radius: 1px; }
.key.away { border-top-color: var(--away); }
.legend.start { justify-content: flex-start; margin-top: 0; }
.tchip { display: inline-flex; gap: 6px; align-items: center; }
.tbl tr.goal td.what { font-weight: 600; }
.tbl .faint { color: var(--muted); }
/* the shot-by-shot list folds up on a phone: team, outcome and score move under the player's name */
.tl .tl-dot, .tl .tl-og, .tl .tl-sub { display: none; }
@media (max-width: 640px) {
  .tl .c-team, .tl .c-what, .tl .c-score { display: none; }
  .tl .c-run { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tl td.who { white-space: normal; width: 100%; padding-left: 26px; text-indent: -16px; overflow-wrap: anywhere; }
  .tl th:nth-child(3) { padding-left: 26px; }
  .tl .tl-dot { display: inline-block; margin-right: 6px; }
  .tl .tl-og { display: inline; }
  .tl .tl-sub { display: block; text-indent: 0; font-weight: 400; color: var(--ink-2); }
  .tl tr.goal .tl-sub { font-weight: 600; color: var(--ink); }
}

/* ---------- tables ---------- */
.tbl-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl-wrap.tall { max-height: 452px; overflow-y: auto; }
.tbl-wrap.tall thead th { position: sticky; top: 0; z-index: 1; box-shadow: 0 1px 0 var(--line); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl th { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface); vertical-align: bottom; }
.tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.strong { font-weight: 600; }
.tbl td.soft { white-space: normal; min-width: 150px; }

   ============================================================ */

  const PEN_SPOT = { x: 108, y: 40 };
  const sigmoid = (v) => 1 / (1 + Math.exp(-v));

    if (sit === "fk") return { x: s.x, y: s.y, head: 0, other: 0, fk: 1, pen: 0, oo: 0, og: 0, ast: "none" };
    return {
      x: s.x, y: s.y,
      head: s.body === "head" ? 1 : 0,
      other: s.body === "other" ? 1 : 0,
      fk: 0, pen: 0,

   Everything on the Players, Keepers, Teams and Method tabs is
   worked out here from the tagged shots. Nothing is stored

   ============================================================ */

  function data(teams, matches, now) {

    for (const id of Object.keys(matches)) {
      const m = matches[id];

      const gk = m.gk || {};

        date: m.date, ko: m.ko, home: m.home, away: m.away, venue: m.venue, done: true, gk: { h: gk.h || null, a: gk.a || null },
        shots: (m.shots || []).map((s) => Object.assign({}, s)), og: (m.og || []).map((o) => Object.assign({}, o)),
      };
      if (gk.h) used.add(gk.h);
      if (gk.a) used.add(gk.a);
      for (const s of m.shots || []) { used.add(s.p); if (s.ap) used.add(s.ap); if (s.k) used.add(s.k); }
    }
    const outT = {};
    for (const id of Object.keys(teams)) {
      const t = teams[id];
      outT[id] = { name: t.name, short: t.short, players: (t.players || []).filter((p) => used.has(p.id)).map((p) => ({ id: p.id, name: p.name, num: p.num })) };
    }
    return { v: 1, generated: now, teams: outT, matches: outM };
  }

  /* finished matches, and matches that have shots but are not marked finished (those stay private) */
  function counts(matches) {
    let done = 0, open = 0;
    for (const m of Object.values(matches)) {
      if (m.done) done += 1;
      else if ((m.shots || []).length || (m.og || []).length) open += 1;
    }
    return { done, open };

  function page(template, d) {
    if (typeof template !== "string") return null;
    const at = template.indexOf(MARK);
    if (at < 0 || template.indexOf(MARK, at + MARK.length) >= 0) return null;
    const json = JSON.stringify(d).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    return template.slice(0, at) + json + template.slice(at + MARK.length);
  }

  /* a GitHub repository written as owner/name, and the two addresses that follow from it.
     branch is the branch GitHub serves the page from: main unless the setting says otherwise. */
  function site(repo, branch) {
    const m = /^\s*(?:https?:\/\/github\.com\/)?([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}))\/([A-Za-z0-9._-]{1,100}?)(?:\.git)?\/?\s*$/.exec(String(repo || ""));
    if (!m) return null;
    const owner = m[1], name = m[2];
    const home = name.toLowerCase() === owner.toLowerCase() + ".github.io";
    const br = typeof branch === "string" && /^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(branch) ? branch : "main";
    return {
      repo: owner + "/" + name, branch: br,
      url: "https://" + owner.toLowerCase() + ".github.io/" + (home ? "" : name + "/"),
      upload: "https://github.com/" + owner + "/" + name + "/upload/" + br,
    };

  return { MARK, data, counts, page, site };
})();

function useWidth(ref, fallback) {

  useEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    const measure = () => { const r = el.getBoundingClientRect().width; if (r > 0) setW(r); };
    measure();

    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

}

function SortTable({ cols, rows, initial, rowKey, onRow, selKey, caption }) {

   MATCH TIMELINE: the xG worm and the shot-by-shot list

/* a rough width for a piece of text at a given size, erring wide, so a label can be checked for room before it is drawn */
function textW(str, px) {
  let em = 0;
  for (const ch of String(str)) {
    if (" .,:;'|!il\u2032".indexOf(ch) >= 0) em += 0.32;
    else if ("jtfrI()-\u2013".indexOf(ch) >= 0) em += 0.42;
    else if ("mwMW".indexOf(ch) >= 0) em += 0.92;
    else if (ch >= "A" && ch <= "Z") em += 0.7;
    else if (ch >= "0" && ch <= "9") em += 0.62;
    else em += 0.59;
  }
  return em * px;
}
/* the name to print beside a goal: the nickname in brackets when the squad list has one, otherwise the name as saved */
const goalName = (name) => { const m = /\(([^)]+)\)\s*$/.exec(name || ""); return m ? m[1] : name; };
const WORM_LABEL_PX = 11.5, WORM_END_PX = 12;

/* everything the worm needs to draw itself at a given width, in pixels.
   The lines are stepped: flat until a shot, then straight up by that shot's xG. */
function wormLayout(tl, width, sides, nameOf) {

  const W = Math.max(Math.round(width), 260), H = Math.round(Math.min(Math.max(W * 0.46, 230), 360));
  const endW = narrow ? textW("0.00", WORM_END_PX) : Math.max(textW(sides.h.short, WORM_END_PX), textW(sides.a.short, WORM_END_PX)) + 5 + textW("0.00", WORM_END_PX);
  const mg = { l: 38, r: Math.ceil(10 + endW + 6), t: 24, b: 28 };
  const pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
  const xEnd = Math.min(Math.max(90, Math.ceil((tl.last == null ? 0 : tl.last) / 5) * 5), 130);
  const top = Math.max(tl.placed.h, tl.placed.a);
  const step = top <= 1 ? 0.25 : top <= 2 ? 0.5 : top <= 5 ? 1 : 2;
  const yMax = Math.max(1, Math.ceil(top / step - 1e-9) * step);
  const x = (min) => mg.l + (Math.min(Math.max(min, 0), xEnd) / xEnd) * pw;
  const y = (v) => mg.t + ph - (Math.min(Math.max(v, 0), yMax) / yMax) * ph;
  const yTicks = [], xTicks = [];
  for (let i = 0; i * step <= yMax + 1e-9; i++) yTicks.push(Math.round(i * step * 100) / 100);
  for (let v = 0; v <= xEnd; v += 15) xTicks.push(v);
  const yLabel = (v) => (v === 0 ? "0" : step < 0.5 ? v.toFixed(2) : v.toFixed(1));

  /* the two lines sit a pixel either side of the true height, so when the teams are level (as at kick-off) both still show */
  const nudge = { h: -1, a: 1 };
  const points = (side) => {
    const yy = (v) => y(v) + nudge[side];
    const out = [[x(0), yy(0)]];
    let v = 0;
    for (const p of tl.steps[side]) { out.push([x(p.min), yy(v)], [x(p.min), yy(p.v)]); v = p.v; }
    out.push([x(xEnd), yy(v)]);
    return out;
  };
  const pts = { h: points("h"), a: points("a") };
  const path = (P) => P.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

  const goals = tl.timed.filter((r) => r.goal).map((r) => ({
    id: r.kind + r.id, side: r.t, og: r.kind === "og", cx: x(r.min), cy: y(r.cum[r.t]) + nudge[r.t], text: nameOf(r) + " " + r.min + "\u2032",
  }));
  const ht = { x: x(45), y: mg.t - 6 };
  /* on a phone there is room for a name or two at most, which reads as if the other goals mattered less: show markers only there */
  const labels = narrow ? [] : placeGoalLabels(goals, [pts.h, pts.a], { x0: mg.l + 2, x1: mg.l + pw - 2, y0: 1, y1: mg.t + ph - 2 },
    [{ x0: ht.x - 11, x1: ht.x + 11, y0: ht.y - 12, y1: ht.y + 4 }]);

  /* the two totals at the right-hand end: beside their own line, eased apart only when the lines finish close together */
  const ends = { h: { x: x(xEnd), y: y(tl.placed.h) + nudge.h }, a: { x: x(xEnd), y: y(tl.placed.a) + nudge.a } };
  const ly = { h: ends.h.y, a: ends.a.y }, gap = 15;
  if (Math.abs(ly.h - ly.a) < gap) {
    const up = ly.h <= ly.a ? "h" : "a", lo = up === "h" ? "a" : "h";
    const mid = (ly.h + ly.a) / 2, maxY = mg.t + ph, minY = mg.t + 4;
    ly[up] = mid - gap / 2; ly[lo] = mid + gap / 2;
    if (ly[lo] > maxY) { ly[up] -= ly[lo] - maxY; ly[lo] = maxY; }
    if (ly[up] < minY) { ly[lo] += minY - ly[up]; ly[up] = minY; }
  }
  return { W, H, mg, pw, ph, xEnd, yMax, x, y, yTicks, xTicks, yLabel, narrow, nudge, d: { h: path(pts.h), a: path(pts.a) }, goals, labels, ht, ends, ly };
}

/* find room for a name beside each goal: try the four corners around the marker and keep the first that touches nothing.
   A name with no room is left off; the list under the chart still has it. */
function placeGoalLabels(goals, lines, box, extra) {
  const hits = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const crosses = (r, P) => {
    for (let i = 1; i < P.length; i++) {
      const ax = Math.min(P[i - 1][0], P[i][0]), bx = Math.max(P[i - 1][0], P[i][0]), ay = Math.min(P[i - 1][1], P[i][1]), by = Math.max(P[i - 1][1], P[i][1]);
      if (ax <= r.x1 && bx >= r.x0 && ay <= r.y1 && by >= r.y0) return true;
    }
    return false;
  };
  const marks = goals.map((g) => ({ x0: g.cx - 7, x1: g.cx + 7, y0: g.cy - 7, y1: g.cy + 7 }));
  const placed = [];
  goals.forEach((g, gi) => {
    const w = textW(g.text, WORM_LABEL_PX) + 4;
    const options = [
      { anchor: "end", x: g.cx - 8, y: g.cy - 10 },
      { anchor: "start", x: g.cx + 8, y: g.cy - 10 },
      { anchor: "start", x: g.cx + 8, y: g.cy + 19 },
      { anchor: "end", x: g.cx - 8, y: g.cy + 19 },
    ];
    for (const o of options) {
      /* the box the text really fills at this size: about 12.5px above its baseline and 3.5px below */
      const r = { x0: o.anchor === "end" ? o.x - w : o.x, x1: o.anchor === "end" ? o.x : o.x + w, y0: o.y - 12.5, y1: o.y + 3.5 };
      if (r.x0 < box.x0 || r.x1 > box.x1 || r.y0 < box.y0 || r.y1 > box.y1) continue;
      if (marks.some((q, qi) => qi !== gi && hits(r, q))) continue;
      if ((extra || []).some((q) => hits(r, q))) continue;
      if (placed.some((q) => hits(r, q.rect))) continue;
      if (lines.some((P) => crosses(r, P))) continue;
      placed.push({ id: g.id, text: g.text, anchor: o.anchor, x: o.x, y: o.y, rect: r });
      break;
    }
  });
  return placed;
}

/* the chart. cursor is { min, py } while a minute is being looked at, from the pointer, the keyboard or the list below. */
function XgWorm({ tl, sides, idx, cursor, setCursor }) {
  const box = useRef(null);
  const width = useWidth(box, 640);
  const L = useMemo(() => wormLayout(tl, width, sides, (r) => (r.kind === "og" ? "Own goal" : goalName(pname(idx, r.shot.p)))), [tl, width, idx, sides.h.short, sides.a.short]);
  const { W, H, mg, pw, ph } = L;
  const eventMins = useMemo(() => [...new Set(tl.timed.map((r) => r.min))], [tl]);
  /* on a touch screen nothing "leaves" the chart, so a tap anywhere else puts the tooltip away */
  const active = !!cursor;
  useEffect(() => {
    if (!active) return undefined;
    const away = (e) => { if (e.pointerType !== "mouse" && box.current && !box.current.contains(e.target)) setCursor(null); };
    document.addEventListener("pointerdown", away);
    return () => document.removeEventListener("pointerdown", away);
  }, [active]);

  const fromPointer = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    const px = (e.clientX - r.left) * (W / r.width), py = (e.clientY - r.top) * (H / r.height);
    return { min: Math.round(Math.min(Math.max((px - mg.l) / pw, 0), 1) * L.xEnd), py };
  };
  const onMove = (e) => { const c = fromPointer(e); if (c) setCursor(c); };
  const onDown = (e) => { if (e.pointerType !== "mouse" && e.currentTarget.focus) e.currentTarget.focus(); onMove(e); };
  const onLeave = (e) => { if (e.pointerType === "mouse") setCursor(null); };
  const onKey = (e) => {
    if (e.key === "Escape") { setCursor(null); return; }
    if (!eventMins.length) return;
    const cur = cursor ? cursor.min : eventMins[eventMins.length - 1];
    let next = null;
    if (e.key === "ArrowLeft") next = [...eventMins].reverse().find((v) => v < cur);
    else if (e.key === "ArrowRight") next = eventMins.find((v) => v > cur);
    else if (e.key === "Home") next = eventMins[0];
    else if (e.key === "End") next = eventMins[eventMins.length - 1];
    else return;
    e.preventDefault();
    setCursor({ min: next == null ? cur : next, py: null });
  };
  const onFocus = () => { if (!cursor && eventMins.length) setCursor({ min: eventMins[eventMins.length - 1], py: null }); };

  const cls = { h: "home", a: "away" };
  const aria = "xG worm. " + sides.h.name + " " + f2(tl.placed.h) + " xG, " + sides.a.name + " " + f2(tl.placed.a) + " xG. Left and right arrow keys step through the shots. The list below has every shot.";
  let tip = null, mark = null;
  if (cursor) {
    const v = Stats.timelineAt(tl, cursor.min), cx = L.x(cursor.min);
    const here = tl.timed.filter((r) => r.min === cursor.min);
    const top = Math.min(Math.max(cursor.py == null ? mg.t + ph / 2 : cursor.py, 46), H - 46);
    const leftHalf = cx < W / 2;
    const room = Math.min(260, Math.max((leftHalf ? W - cx : cx) - 16, 130));
    tip = h("div", { className: "tip rows", style: Object.assign({ top, transform: "translateY(-50%)", maxWidth: room }, leftHalf ? { left: cx + 12 } : { right: W - cx + 12 }) },
      h("strong", null, cursor.min + "\u2032"),
      ["h", "a"].map((sd) => h("span", { key: sd, className: "tr" }, h("i", { className: "key " + cls[sd] }), h("b", null, f2(v[sd])), sides[sd].short)),
      here.map((r) => h("span", { key: r.kind + r.id, className: "ev" },
        r.kind === "og" ? "Own goal, counts for " + sides[r.t].short : pname(idx, r.shot.p) + ": " + shotLine(r.shot) + ", " + f2(r.xg) + " xG")));
    mark = h("g", { pointerEvents: "none" },
      h("path", { className: "wc", d: "M" + cx.toFixed(1) + "," + mg.t + " V" + (mg.t + ph) }),
      ["h", "a"].map((sd) => h("circle", { key: sd, className: "wm " + cls[sd], cx, cy: L.y(v[sd]) + L.nudge[sd], r: 4 })));
  }

  return h("div", { className: "worm", ref: box },
    h("svg", {
      viewBox: "0 0 " + W + " " + H, height: H, role: "img", tabIndex: 0, "aria-label": aria,
      onPointerMove: onMove, onPointerDown: onDown, onPointerLeave: onLeave, onKeyDown: onKey, onFocus, onBlur: () => setCursor(null),
    },
      L.yTicks.map((v) => h("g", { key: "y" + v },
        h("path", { className: "wg" + (v === 0 ? " base" : ""), d: "M" + mg.l + "," + L.y(v).toFixed(1) + " H" + (mg.l + pw) }),
        h("text", { className: "wt", x: mg.l - 7, y: L.y(v) + 3.5, textAnchor: "end" }, L.yLabel(v)))),
      h("text", { className: "wt", x: mg.l - 7, y: mg.t - 11, textAnchor: "end" }, "xG"),
      L.xTicks.map((v) => h("text", { key: "x" + v, className: "wt", x: L.x(v), y: mg.t + ph + 17, textAnchor: "middle" }, v + "\u2032")),
      h("path", { className: "wg ht", d: "M" + L.ht.x.toFixed(1) + "," + mg.t + " V" + (mg.t + ph) }),
      h("text", { className: "wt", x: L.ht.x, y: L.ht.y, textAnchor: "middle" }, "HT"),
      h("path", { className: "wl away", d: L.d.a }),
      h("path", { className: "wl home", d: L.d.h }),
      ["a", "h"].map((sd) => h("circle", { key: "e" + sd, className: "wm " + cls[sd], cx: L.ends[sd].x, cy: L.ends[sd].y, r: 4 })),
      L.goals.map((g) => (g.og ?
        h("g", { key: g.id, className: "wgoal og" }, h("circle", { className: "wm-back", cx: g.cx, cy: g.cy, r: 7 }), h("circle", { className: "wm-open " + cls[g.side], cx: g.cx, cy: g.cy, r: 4.5 })) :
        h("circle", { key: g.id, className: "wgoal wm " + cls[g.side], cx: g.cx, cy: g.cy, r: 5 }))),
      L.labels.map((l) => h("text", { key: l.id, className: "wn", x: l.x, y: l.y, textAnchor: l.anchor }, l.text)),
      ["h", "a"].map((sd) => h("text", { key: "l" + sd, className: "we", x: L.ends[sd].x + 10, y: L.ly[sd] + 4 },
        L.narrow ? null : h("tspan", null, sides[sd].short),
        h("tspan", { className: "v", dx: L.narrow ? 0 : 5 }, f2(tl.placed[sd])))),
      mark),
    tip);
}

function MatchTimeline({ s, idx, m, can }) {
  const tl = useMemo(() => Stats.timeline(m), [m.shots, m.og]);
  const [cursor, setCursor] = useState(null);
  const sides = { h: { name: tname(s.teams, m.home), short: tshort(s.teams, m.home) }, a: { name: tname(s.teams, m.away), short: tshort(s.teams, m.away) } };
  const rows = tl.timed.concat(tl.untimed);
  if (!rows.length) {
    return h("div", { className: "empty" }, h("strong", null, "Nothing on the timeline yet"),
      can ? "Tag the shots first. Give each one a minute and it lands here." : "This match has not been tagged.");
  }
  const lost = tl.untimed.filter((r) => r.kind === "shot").length;
  const hasOg = tl.timed.some((r) => r.kind === "og");
  const notes = [];
  if (lost && tl.timed.length) {
    notes.push((lost === 1 ? "1 shot has no minute, so it is left off the worm" : lost + " shots have no minute, so they are left off the worm")
      + " (" + f2(tl.unplaced.h + tl.unplaced.a) + " xG)." + (can ? " Add the minute on the Tag shots tab to place " + (lost === 1 ? "it." : "them.") : ""));
  }
  if (!m.done && tl.timed.length) notes.push("This match is not marked as finished, so the lines may still move.");

  const worm = h("div", { className: "card stack worm-card" },
    h("div", { className: "step" }, h("h2", { className: "h2" }, "xG worm"),
      h("span", { className: "hint" }, "Each team's xG added up through the match. Every step is a shot.")),
    tl.timed.length ? h(Frag, null,
      h("div", { className: "legend start" },
        h("span", null, h("i", { className: "key home" }), sides.h.name),
        h("span", null, h("i", { className: "key away" }), sides.a.name),
        h("span", null, h("i", { className: "dot solid" }), "Goal"),
        hasOg ? h("span", null, h("i", { className: "dot hollow" }), "Own goal") : null),
      h(XgWorm, { tl, sides, idx, cursor, setCursor })) :
      h("div", { className: "empty" }, h("strong", null, "No minutes yet"), "The worm needs the minute of each shot." + (can ? " Add it on the Tag shots tab." : "")),
    notes.map((n, i) => h("p", { key: i, className: "sub" }, n)));

  /* One table, two shapes. On a wide screen every fact has its own column. On a phone the team, outcome and score
     fold in under the player's name (the tl-* pieces below), so minute, shot and outcome all show without sideways scrolling. */
  const list = h("div", { className: "card stack" },
    h("h2", { className: "h2" }, "Shot by shot"),
    h("div", { className: "tbl-wrap" }, h("table", { className: "tbl tl" },
      h("caption", { className: "sr" }, "Every shot in order, with the score and each team's running xG"),
      h("thead", null, h("tr", null,
        h("th", { className: "num", scope: "col" }, "Min"), h("th", { className: "c-team", scope: "col" }, "Team"), h("th", { scope: "col" }, "Player"),
        h("th", { className: "c-what", scope: "col" }, "Outcome"), h("th", { className: "num", scope: "col" }, "xG"), h("th", { className: "num c-score", scope: "col" }, "Score"),
        h("th", { className: "num c-run", scope: "col", title: "Each team's xG so far, " + sides.h.short + " first" }, sides.h.short + " \u2013 " + sides.a.short + " xG"))),
      h("tbody", null, rows.map((r) => {
        const timed = r.min != null, og = r.kind === "og";
        const what = og ? "Own goal" : shotLine(r.shot);
        const score = r.goal && r.score ? r.score.h + "\u2013" + r.score.a : "";
        return h("tr", {
          key: r.kind + r.id, className: ((r.goal ? "goal" : "") + (cursor && timed && r.min === cursor.min ? " sel" : "")).trim() || undefined,
          onMouseEnter: timed ? () => setCursor({ min: r.min, py: null }) : undefined, onMouseLeave: timed ? () => setCursor(null) : undefined,
        },
          h("td", { className: "num" }, timed ? r.min + "\u2032" : h("span", { className: "faint", title: "No minute saved" }, "\u2013")),
          h("td", { className: "c-team" }, h("span", { className: "tchip" }, h("i", { className: "dot " + (r.t === "h" ? "home" : "away") }), sides[r.t].short)),
          h("td", { className: "strong who" },
            h("i", { className: "tl-dot dot " + (r.t === "h" ? "home" : "away") }),
            og ? h("span", { className: "tl-og" }, "Own goal") : pname(idx, r.shot.p),
            h("span", { className: "tl-sub" }, [sides[r.t].short, og ? null : what, score || null].filter(Boolean).join(" \u00b7 "))),
          h("td", { className: "what soft c-what" }, what),
          h("td", { className: "num" }, og ? "" : f2(r.xg)),
          h("td", { className: "num c-score" }, score),
          h("td", { className: "num c-run" }, r.cum ? f2(r.cum.h) + " \u2013 " + f2(r.cum.a) : ""));
      })))));

  return h(Frag, null, worm, list);
}

/* ============================================================
   PLAYERS, KEEPERS AND TEAMS: the season tables
   ============================================================ */
const NoShotsYet = ({ what }) => (READER ?
  h("div", { className: "empty" }, h("strong", null, "Nothing here yet"), "After the first finished match, " + what + " fill in here.") :
  h("div", { className: "empty" }, h("strong", null, "No shots tagged yet"), "Tag a match and " + what + " fill in here."));
/* the public page counts finished matches only; the tracker counts everything tagged */
const matchesWord = (n) => n + (READER ? (n === 1 ? " finished match" : " finished matches") : (n === 1 ? " tagged match" : " tagged matches"));
const Defs = ({ items }) => h("dl", { className: "deflist" }, items.map(([t, d]) => h(Frag, { key: t }, h("dt", null, t), h("dd", null, d))));
const ClubSelect = ({ id, s, value, onChange }) => h("div", { className: "field" },
  h("label", { className: "label", htmlFor: id }, "Club"),
  h("select", { id, className: "input", value, onChange: (e) => onChange(e.target.value) },
    [h("option", { key: "", value: "" }, "All clubs")].concat(Object.keys(s.teams).sort((a, b) => s.teams[a].name.localeCompare(s.teams[b].name)).map((t) => h("option", { key: t, value: t }, s.teams[t].name)))));
const Kpi = ({ v, k }) => h("div", { className: "kpi" }, h("div", { className: "v" }, v), h("div", { className: "k" }, k));

const PLAYER_COLS = [
  { key: "name", label: "Player", get: (r) => r.name, strong: true },
  { key: "club", label: "Club", get: (r) => r.club },
  { key: "sh", label: "Shots", num: true, get: (r) => r.sh, title: "Every shot taken, penalties included" },
  { key: "sot", label: "On target", num: true, get: (r) => r.sot, title: "Shots that were scored or saved by the keeper" },
  { key: "g", label: "Goals", num: true, get: (r) => r.g, title: "Goals scored, penalties included" },
  { key: "xg", label: "xG", num: true, get: (r) => r.xg, fmt: f2, title: "Expected goals from all shots" },
  { key: "diff", label: "G " + MINUS + " xG", num: true, get: (r) => r.diff, fmt: signed, title: "Goals minus expected goals" },
  { key: "npxg", label: "npxG", num: true, get: (r) => r.npxg, fmt: f2, title: "Expected goals without penalties" },
  { key: "per", label: "npxG / shot", num: true, get: (r) => r.per, fmt: f2, title: "Average chance quality, penalties left out" },
  { key: "xgot", label: "xGOT", num: true, get: (r) => r.xgot, fmt: f2, title: "Expected goals on target: chance of scoring given where each shot was placed" },
  { key: "kp", label: "Key passes", num: true, get: (r) => r.kp, title: "Passes that led straight to a shot" },
  { key: "a", label: "Assists", num: true, get: (r) => r.a, title: "Key passes that ended in a goal" },
  { key: "xa", label: "xA", num: true, get: (r) => r.xa, fmt: f2, title: "Expected assists: the xG of the shots this player set up" },
];

function PlayersView({ s, idx, agg }) {
  const [team, setTeam] = useState("");
  const [q, setQ] = useState("");
  const [minSh, setMinSh] = useState(0);
  const [sel, setSel] = useState(null);
  const rows = useMemo(() => Object.keys(agg.players).map((id) => {
    const d = agg.players[id];
    return { id, name: pname(idx, id), club: tshort(s.teams, d.team), team: d.team, sh: d.sh, sot: d.sot, g: d.g, xg: d.xg, diff: d.g - d.xg, npxg: d.npxg, per: d.npsh ? d.npxg / d.npsh : null, xgot: d.xgot, kp: d.kp, a: d.a, xa: d.xa, pens: d.pens, pg: d.pg };
  }), [agg, idx, s.teams]);
  if (!rows.length) return h(NoShotsYet, { what: "every player's shots, goals, xG and xA" });
  const shown = rows.filter((r) => (!team || r.team === team) && r.sh >= minSh && (!q || fold(r.name).includes(fold(q))));
  const picked = sel && agg.players[sel] ? rows.find((r) => r.id === sel) : null;
  return h("div", { className: "stack" },
    h("div", { className: "row" },
      h("div", { className: "field grow", style: { maxWidth: 280 } }, h("label", { className: "label", htmlFor: "pl-q" }, "Find a player"),
        h("input", { id: "pl-q", className: "input", type: "search", placeholder: "Type a name", value: q, onChange: (e) => setQ(e.target.value) })),
      h(ClubSelect, { id: "pl-club", s, value: team, onChange: setTeam }),
      h(Seg, { label: "At least", value: minSh, onChange: setMinSh, options: [{ value: 0, label: "Any" }, { value: 5, label: "5 shots" }, { value: 10, label: "10" }, { value: 20, label: "20" }] })),
    picked ? h(PlayerDetail, { s, idx, r: picked, close: () => setSel(null) }) : null,
    shown.length ? h(SortTable, { cols: PLAYER_COLS, rows: shown, initial: { key: "xg", dir: -1 }, rowKey: (r) => r.id, onRow: (id) => setSel(sel === id ? null : id), selKey: sel, caption: "Player totals" }) :
      h("div", { className: "empty" }, h("strong", null, "No players match"), "Loosen the filters above."),
    h("p", { className: "sub" }, "Click a player to see their shot map. Click a column heading to sort. From " + matchesWord(agg.totals.matches) + " and " + agg.totals.shots + (agg.totals.shots === 1 ? " shot." : " shots.")),
    h(Defs, { items: [
      ["xG", "Expected goals. Each shot is worth the chance that a shot like it is scored, from 0 to 1. A penalty is worth 0.76."],
      ["G " + MINUS + " xG", "Goals minus xG. Above zero means more goals than the chances were worth."],
      ["npxG", "xG with penalties left out."],
      ["xGOT", "xG on target. Rates each on-target shot again once you know where in the goal it went. Shots off target count zero."],
      ["Key passes", "Passes that led straight to a shot. An assist is a key pass that ended in a goal."],
      ["xA", "Expected assists. The xG of every shot the player set up, scored or not."],
    ] }));
}

function PlayerDetail({ s, idx, r, close }) {
  const shots = useMemo(() => {
    const out = [];
    for (const { id, m } of sortedMatches(s.matches)) for (const x of m.shots) if (x.p === r.id) out.push({ x, mid: id, m });
    return out;
  }, [s.matches, r.id]);

        h("li", null, "If it was scored or saved, click the goal where the ball ended up."),
        h("li", null, "Add the details that change the chance: header, free kick or penalty, the pass before it, one-on-one, open goal."),
        h("li", null, "Save the shot. When the match is done, mark it as finished."))),
    h("section", { className: "stack tight" },
      h("h2", { className: "h2" }, "What counts as what"),
      h(Defs, { items: [
        ["Shot", "Any attempt to score, blocked ones included. An own goal is not a shot. Add it under Own goals in the match."],
        ["Minute", "The minute on the match clock when the shot was taken. For added time at the end of the first half, type 45, so the shot stays before half-time on the match timeline."],
        ["On target", "Scored, or saved by the goalkeeper. A shot blocked by a defender, or one that hits the post or bar and stays out, is not on target."],
        ["Direct free kick", "A shot struck straight from the free kick. A header from a free-kick cross is open play, with Free kick as the pass before it."],
        ["Cross", "A ball played in from wide, a pull-back along the ground included."],
        ["Through ball", "A pass played in behind the defence for the shooter to run onto."],
        ["Corner, Free kick", "As the pass before the shot: the shot came straight from that delivery."],
        ["One-on-one", "The shooter is through with only the goalkeeper to beat."],
        ["Open goal", "The goalkeeper is out of position or on the ground and the goal is unguarded."],
        ["Who set it up", "The player who made the pass straight before the shot. Leave it empty for rebounds, loose balls and solo runs."],
      ] })),
    h("section", { className: "stack tight" },
      h("h2", { className: "h2" }, "How the numbers are worked out"),
      h("div", { className: "prose" },
        h("p", null, h("strong", null, "xG"), " is the chance that a shot is scored, judged before it is struck. It uses how far out and how central the shot is, foot or head, whether it is a direct free kick, the pass before it, and whether it is a one-on-one or an open goal. A penalty is always 0.76."),
        h("p", null, h("strong", null, "xA"), " gives the player who set up a shot that shot's xG, scored or not."),
        h("p", null, h("strong", null, "The xG worm"), " on a match's Timeline tab adds up each team's xG as the match goes on. The line steps up at every shot, by that shot's xG. A shot saved without a minute cannot be placed, so it is left off the worm but still counts in every total."),
        h("p", null, h("strong", null, "xG on target"), " rates a shot again once you know where in the goal it was heading. A shot into the top corner is worth more than one straight at the keeper."),
        h("p", null, h("strong", null, "Expected saves"), " is what an average goalkeeper would save from the same shots: shots on target faced minus xG on target faced. ", h("strong", null, "Saves above expected"), " is real saves minus that, the same number as goals prevented."))),
    h("section", { className: "stack tight" },
      h("h2", { className: "h2" }, "Where the model comes from"),
      h("div", { className: "prose" },
        h("p", null, "It was trained on ", h("strong", null, MODEL.n.pool.toLocaleString("en-IN") + " shots"), " from StatsBomb's free data: the Premier League, La Liga, Serie A and Ligue 1 in 2015-16, part of the Bundesliga that season, and six international tournaments from 2018 to 2024."),
        h("p", null, "It was then tuned to ", h("strong", null, MODEL.n.isl.toLocaleString("en-IN") + " ISL shots from 2021-22"), ", the one ISL season with free shot-by-shot data. In that season ISL shots from distance went in more often than the same shots elsewhere, and the clearest chances a little less often, so the model builds that in."),
        h("p", null, "On that ISL season, player totals from this model line up closely with StatsBomb's own xG: a correlation of 0.97 for players with 20 or more shots and 0.99 for teams."),
        h("p", null, "Its limits: it cannot see where the defenders are, and shot locations are placed by hand. One shot can be off. Season totals are far steadier."))),
    s.reader ? null : h("section", { className: "stack tight" },
      h("h2", { className: "h2" }, "Model check on your data"),
      h("p", { className: "sub", style: { maxWidth: "68ch" } }, "If the model fits this season, goals divided by expected goals sits near 1.00. With fewer than about 300 shots it is mostly luck. If it stays well away from 1.00 after that, the model needs re-tuning."),
      c.all.n ? h("div", { className: "tbl-wrap" }, h("table", { className: "tbl" },
        h("thead", null, h("tr", null, h("th", { scope: "col" }, "Shots counted"), h("th", { className: "num", scope: "col" }, "Shots"), h("th", { className: "num", scope: "col" }, "Goals"), h("th", { className: "num", scope: "col" }, "Expected"), h("th", { className: "num", scope: "col" }, "Goals \u00f7 expected"))),
        h("tbody", null,
          checkRow("All shots", c.all, "xG"), checkRow("Without penalties", c.np, "xG"), checkRow("Inside the box", c.inbox, "xG"), checkRow("Outside the box", c.outbox, "xG"),
          checkRow("Headers", c.head, "xG"), checkRow("Penalties", c.pen, "xG"), checkRow("On target, by placement", c.ot, "xGOT")))) :
        h("div", { className: "empty" }, h("strong", null, "Nothing to check yet"), "This fills in as you tag shots.")),
    s.canExport ? h("section", { className: "stack tight" },
      h("h2", { className: "h2" }, "Take your data out"),

      h("div", { className: "row" },
        h("button", { type: "button", className: "btn", onClick: () => save("isl-shots.csv", () => exportShots(s, idx)) }, "Every shot (CSV)"),

        h("button", { type: "button", className: "btn", onClick: () => save("isl-keepers.csv", () => exportKeepers(s, idx, agg)) }, "Keeper totals (CSV)"),
        h("button", { type: "button", className: "btn", onClick: () => save("isl-xg-backup.json", () => JSON.stringify({ exported: new Date().toISOString(), model: MODEL.version, teams: s.teams, matches: s.matches }, null, 1)) }, "Full backup (JSON)")),

/* ============================================================
   THE PAGE SHELL
   ============================================================ */
/* the public page has no Squads tab: squads are a tagging tool */
const TABS = [["matches", "Matches"], ["players", "Players"], ["keepers", "Keepers"], ["teams", "Teams"], ["squads", "Squads"], ["method", "Method"]].filter((t) => !READER || t[0] !== "squads");
const ROUTE_KEY = READER ? "islxg.public.route" : "islxg.route";
/* "Updated 9 Oct 2026" from the moment the public page was saved, in the reader's own time zone */
function updatedLabel(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return "";
  return "Updated " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function firstRoute(saved) {
  const ok = (r) => r && TABS.some((t) => t[0] === r.tab);
  const keep = (r) => ({ tab: r.tab, matchId: r.matchId || null, view: r.matchId && r.view === "timeline" ? "timeline" : "tag" });
  if (saved && ok(saved.route)) return keep(saved.route);
  const hash = String(window.location.hash || "").replace("#", "");
  if (TABS.some((t) => t[0] === hash)) return { tab: hash, matchId: null, view: "tag" };
  try {
    const r = JSON.parse(window.localStorage.getItem(ROUTE_KEY) || "null");
    if (ok(r)) return keep(r);
  } catch (e) { /* storage can be unavailable; start on Matches */ }
  return { tab: "matches", matchId: null, view: "tag" };
}

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  render() {
    if (!this.state.failed) return this.props.children;
    return h("div", { className: "wrap" }, h("div", { className: "empty" }, h("strong", null, "This screen hit a problem"), "Reload the page. Everything you saved is safe."));
  }
}

function App({ initial }) {
  const s = useSyncExternalStore(Store.subscribe, Store.get);
  const [route, setRoute] = useState(() => firstRoute(initial));
  const routeRef = useRef(route);
  routeRef.current = route;
  const go = (r) => {
    setRoute(r);
    try { window.localStorage.setItem(ROUTE_KEY, JSON.stringify(r)); } catch (e) { /* fine without it */ }
    if (r.tab !== route.tab || r.matchId !== route.matchId) { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }
  };
  useEffect(() => {
    try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ route: routeRef.current })); } catch (e) { /* optional */ }
  }, []);
  const idx = useMemo(() => buildIndex(s.teams), [s.teams]);
  const agg = useMemo(() => Stats.aggregate(s.teams, s.matches), [s.teams, s.matches]);

  let sync = null;
  if (s.phase === "loading") sync = h("span", { className: "sync" }, h(IconDots), "Loading");
  else if (s.phase === "ready") {
    if (s.saveError) sync = h("span", { className: "sync bad" }, h(IconWarn), "Not saved");
    else if (s.saving) sync = h("span", { className: "sync" }, h(IconDots), "Saving");
    else if (s.canWrite) sync = h("span", { className: "sync ok" }, h(IconCheck), "All changes saved");
    else if (s.reader) sync = updatedLabel(s.generated) ? h("span", { className: "sync" }, updatedLabel(s.generated)) : null;
    else sync = h("span", { className: "sync" }, "View only");
  }

  let view;
  if (s.phase === "loading") view = h("div", { className: "empty" }, h("strong", null, "Loading your data"), "One moment.");
  else if (s.phase === "nodb") view = route.tab === "method" ? h(MethodView, { s, idx, agg }) : h("div", { className: "empty" }, h("strong", null, "Your data cannot be reached from here"), "Open this page inside Claude while signed in, and your matches and shots will load.");
  else if (route.tab === "matches") view = route.matchId ? h(MatchView, { s, idx, matchId: route.matchId, view: route.view, onView: (v) => go({ tab: "matches", matchId: route.matchId, view: v }), back: () => go({ tab: "matches", matchId: null }) }) : h(MatchesView, { s, agg, open: (id) => go({ tab: "matches", matchId: id }) });
  else if (route.tab === "players") view = h(PlayersView, { s, idx, agg });
  else if (route.tab === "keepers") view = h(KeepersView, { s, idx, agg });
  else if (route.tab === "teams") view = h(TeamsView, { s, agg });
  else if (route.tab === "squads") view = h(SquadsView, { s });
  else view = h(MethodView, { s, idx, agg });

  return h("div", { className: "wrap" },
    h("header", { className: "mast" },
      h("div", { className: "brand" }, h("h1", null, "ISL xG Tracker"), h("span", { className: "season" }, "2026-27")),
      h("div", { role: "status", "aria-live": "polite" }, sync)),
    h("nav", { className: "tabs", "aria-label": "Sections" }, TABS.map(([id, label]) => h("button", {
      key: id, type: "button", className: "tab" + (route.tab === id ? " on" : ""), "aria-current": route.tab === id ? "page" : undefined,
      onClick: () => go({ tab: id, matchId: null }),
    }, label))),
    s.saveError ? h(Note, { kind: "bad", action: s.saveError.denied ? null : h("button", { type: "button", className: "btn", onClick: Store.retry }, "Retry") }, s.saveError.message) : null,
    h("main", { className: "stack" }, h(Boundary, { key: route.tab + (route.matchId || "") }, view)),
    route.tab !== "method" ? h("div", { className: "credit" }, h(SbLogo),
      h("p", { className: "foot" }, "xG model built on StatsBomb Open Data. An independent project, not affiliated with the Indian Super League or its clubs.")) : null);
}

(function boot() {
  let started = false;
  const start = (saved) => {
    if (started) return;
    started = true;
    Store.init();
    ReactDOM.createRoot(document.getElementById("app")).render(h(Boundary, null, h(App, { initial: saved || {} })));
  };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === "function") {
    try { hot.ready(start); } catch (e) { start({}); }
    setTimeout(() => start({}), 2500);
  } else {
    start((hot && hot.data) || {});
  }
})();
</script>
